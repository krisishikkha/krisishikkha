<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Live Scoreboard Update - NTRCA Agriculture</title>

<style>
body{ font-family: Arial,sans-serif; background:#f8f8f8; padding:20px;}
h2{ margin-bottom:20px;}
select, button, input{ padding:8px 12px; font-size:16px; margin-right:10px;}
button{ padding:10px 20px; background:#2E8B57; color:white; border:none; border-radius:6px; cursor:pointer;}
button:hover{ background:#246b45;}
.pdf-container{ width:100%; margin:auto; background:#fff; padding:20px; border-radius:6px;}
.pdf-header{text-align:center; margin-bottom:20px;}
.pdf-header h1{ font-size:22px; margin:0; color:#2E8B57;}
.pdf-header h3{ font-size:16px; margin:5px 0; color:#333;}
table{ width:100%; border-collapse:collapse; margin-top:10px;}
th, td{ border:1px solid #ddd; padding:8px; text-align:center; font-size:14px;}
th{ background:#2E8B57; color:white;}
.pass{background:#d4edda;}
.fail{background:#f8d7da;}
.top-rank{ font-weight:bold; color:#ff8c00; }

@media print{
table{ page-break-inside:auto }
tr{ page-break-inside:avoid; page-break-after:auto }
thead{ display:table-header-group }
}
</style>

</head>
<body>

<h2>Live Scoreboard - NTRCA Agriculture</h2>

<select id="examSelect">
<option value="">-- Select Exam --</option>
</select>

<input type="date" id="startDate">
<input type="date" id="endDate">

<button id="downloadBtn">Download PDF</button>

<div class="pdf-container" id="liveTableContainer">

<div class="pdf-header">
<h1>NTRCA Agriculture Teacher Registration-2026</h1>
<h3 id="examTitleHeader">Exam Title</h3>
<h3 id="examDateHeader"></h3>
</div>

<table id="scoreTable">
<thead>
<tr>
<th>Name (Rank)</th>
<th>Correct</th>
<th>Wrong</th>
<th>Unanswered</th>
<th>Percentage</th>
<th>Result</th>
</tr>
</thead>

<tbody id="scoreBody"></tbody>

</table>
</div>

<script src="exam-status.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

<script>

// ================= Supabase =================
const SUPABASE_URL = "https://bpkheipwdjzlyuzyqdxz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_xOzl8Ctl6AtJlR1i8g3bEw_veKboXz2";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ================= Global =================
let allResults = JSON.parse(localStorage.getItem("krisishikkha_results")) || [];
let currentExamId = "";

// ================= Dropdown =================
function initExamDropdown(){

const examSelect = document.getElementById("examSelect");

examSelect.innerHTML='<option value="">-- Select Exam --</option>';

if(typeof EXAM_STATUS==="undefined"){
console.error("exam-status.js not loaded");
return;
}

for(const examId in EXAM_STATUS){

const exam = EXAM_STATUS[examId];

if(exam && exam.visible){

const opt=document.createElement("option");

opt.value=examId;

opt.textContent=exam.title;

examSelect.appendChild(opt);

}

}

}

// ================= Save Result =================
async function saveToSupabase(result){

try{

await supabaseClient

.from("exam_results")

.insert([result]);

}

catch(err){

console.log(err);

}

}

// ================= Render =================
function renderLiveScoreboard(examId){

const tbody=document.getElementById("scoreBody");

const titleHeader=document.getElementById("examTitleHeader");

const dateHeader=document.getElementById("examDateHeader");

titleHeader.innerText="Exam Title: "+EXAM_STATUS[examId].title;

dateHeader.innerText="Generated: "+new Date().toLocaleString("en-GB");

document.title="Live Scoreboard - "+EXAM_STATUS[examId].title;

let results=allResults.filter(r=>r.examId===examId);

// date filter

const startDate=document.getElementById("startDate").value;

const endDate=document.getElementById("endDate").value;

if(startDate){

const s=new Date(startDate);

results=results.filter(r=>new Date(r.start)>=s);

}

if(endDate){

const e=new Date(endDate);

e.setHours(23,59,59,999);

results=results.filter(r=>new Date(r.start)<=e);

}

// sort

results.sort((a,b)=>b.correct-a.correct);

tbody.innerHTML="";

results.forEach((r,i)=>{

const status=r.percent>=40?"PASS":"FAIL";

let rank="";

if(i==0) rank="1st";

else if(i==1) rank="2nd";

else if(i==2) rank="3rd";

else if(i==3) rank="4th";

else if(i==4) rank="5th";

let name=r.name+(rank?` (${rank})`:"");

const tr=document.createElement("tr");

if(i<5) tr.classList.add("top-rank");

tr.classList.add(status==="PASS"?"pass":"fail");

tr.innerHTML=`

<td>${name}</td>

<td>${r.correct}</td>

<td>${r.wrong}</td>

<td>${r.unanswered}</td>

<td>${r.percent}%</td>

<td>${status}</td>

`;

tbody.appendChild(tr);

});

}

// ================= Auto Refresh =================
setInterval(()=>{

if(currentExamId){

allResults=JSON.parse(localStorage.getItem("krisishikkha_results"))||[];

renderLiveScoreboard(currentExamId);

}

},2000);

// ================= Date Filter =================
document.getElementById("startDate").addEventListener("change",()=>{

if(currentExamId) renderLiveScoreboard(currentExamId);

});

document.getElementById("endDate").addEventListener("change",()=>{

if(currentExamId) renderLiveScoreboard(currentExamId);

});

// ================= Exam Select =================
document.getElementById("examSelect").addEventListener("change",function(){

const examId=this.value;

if(examId){

currentExamId=examId;

renderLiveScoreboard(examId);

}

});

// ================= Download PDF =================
document.getElementById("downloadBtn").addEventListener("click",()=>{

if(!currentExamId){

alert("Please select exam");

return;

}

const element=document.getElementById("liveTableContainer");

html2pdf().set({

margin:[20,10,20,10],

filename:EXAM_STATUS[currentExamId].title+"-Scoreboard.pdf",

html2canvas:{scale:2},

jsPDF:{unit:'pt',format:'a4',orientation:'portrait'}

}).from(element).save();

});

// ================= Load =================
document.addEventListener("DOMContentLoaded",initExamDropdown);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Live Scoreboard - NTRCA Agriculture</title>

<style>

body{
font-family: Arial,sans-serif;
background:#f8f8f8;
padding:20px;
margin:0;
}

h2{
margin-bottom:20px;
}

.control-bar{
display:flex;
flex-wrap:wrap;
gap:10px;
align-items:center;
margin-bottom:18px;
}

select,button{
padding:10px 12px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#2E8B57;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#246b45;
}

.pdf-container{
width:100%;
max-width:900px;
margin:auto;
background:#ffffff;
padding:25px;
border-radius:8px;
position:relative;
overflow:hidden;
}

/* ===== WATERMARK ===== */

.watermark{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:120px;
color:rgba(0,0,0,0.05);
font-weight:bold;
pointer-events:none;
white-space:nowrap;
}

/* ===== HEADER ===== */

.pdf-header{
text-align:center;
margin-bottom:20px;
}

.pdf-header img{
width:55px;
margin-bottom:10px;
}

.pdf-header h1{
font-size:22px;
margin:0;
color:#2E8B57;
}

.pdf-header h3{
font-size:17px;
margin:6px 0;
color:#000;
}

.report-range{
font-size:15px;
color:#000;
margin-top:4px;
}

/* ===== TABLE ===== */

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:16px 12px;
text-align:center;
font-size:17px;
color:#000;
}

th{
background:#2E8B57;
color:#ffffff;
}

/* PASS FAIL ROW COLOR */

.pass{
background:#d4edda;
}

.fail{
background:#f8d7da;
}

/* TOP RANK STYLE */

.top-rank{
font-weight:bold;
}

</style>

</head>

<body>

<h2>Live Scoreboard - NTRCA Agriculture</h2>

<div class="control-bar">

<select id="examSelect">
<option value="">-- Select Exam --</option>
</select>

<button id="downloadBtn">Download PDF</button>

</div>

<div class="pdf-container" id="liveTableContainer">

<div class="watermark">
krisishikkha.com
</div>

<div class="pdf-header">

<img src="assets/icons/icon-192.png">

<h1>NTRCA Agriculture Teacher Registration-2026</h1>

<h3 id="examTitleHeader">Exam Title</h3>

<h3 id="examDateHeader"></h3>

<div class="report-range">
Showing all available results
</div>

</div>

<table>

<thead>
<tr>
<th>Name (Rank)</th>
<th>Correct</th>
<th>Wrong</th>
<th>Unanswered</th>
<th>Percentage</th>
<th>Result</th>
</tr>
</thead>

<tbody id="scoreBody"></tbody>

</table>

</div>

<!-- exam status -->
<script src="exam-status.js"></script>

<!-- supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL="https://bpkheipwdjzlyuzyqdxz.supabase.co";
const SUPABASE_KEY="sb_publishable_xOzl8Ctl6AtJlR1i8g3bEw_veKboXz2";

const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);


/* ================= GLOBAL ================= */

let currentExamId="";
let allResults=[];


/* ================= DROPDOWN ================= */

function populateExamDropdown(){

const examSelect=document.getElementById("examSelect");

examSelect.innerHTML='<option value="">-- Select Exam --</option>';

Object.keys(EXAM_STATUS).forEach(id=>{

const exam=EXAM_STATUS[id];

if(exam.visible && exam.status==="live"){

const option=document.createElement("option");

option.value=id;
option.textContent=exam.title;

examSelect.appendChild(option);

}

});

}


/* ================= FETCH RESULTS ================= */

async function fetchResults(){

if(!currentExamId) return;

const {data,error}=await supabaseClient
.from("exam_results")
.select("*")
.eq("examId",currentExamId)
.order("percent",{ascending:false});

if(error){
console.error(error);
return;
}

allResults=data;

renderTable();

}


/* ================= RENDER TABLE ================= */

function renderTable(){

const tbody=document.getElementById("scoreBody");
const title=document.getElementById("examTitleHeader");
const date=document.getElementById("examDateHeader");

const exam=EXAM_STATUS[currentExamId];

if(!exam) return;

title.innerText="Exam Title: "+exam.title;

date.innerText="Generated: "+new Date().toLocaleString();

tbody.innerHTML="";

let lastScore=null;
let rank=0;

allResults.forEach((r,i)=>{

if(r.percent!==lastScore){
rank=i+1;
}

lastScore=r.percent;

let rankLabel="";

if(rank===1) rankLabel="🥇 1st";
else if(rank===2) rankLabel="🥈 2nd";
else if(rank===3) rankLabel="🥉 3rd";
else rankLabel=rank+"th";

const name=r.name+" ("+rankLabel+")";

const status=r.percent>=40?"PASS":"FAIL";

const tr=document.createElement("tr");

if(rank<=3){
tr.classList.add("top-rank");
}

tr.classList.add(status==="PASS"?"pass":"fail");

tr.innerHTML=`

<td>${name}</td>
<td>${r.correct}</td>
<td>${r.wrong}</td>
<td>${r.unanswered}</td>
<td>${r.percent}%</td>
<td>${status}</td>

`;

tbody.appendChild(tr);

});

}


/* ================= REALTIME ================= */

function subscribeRealtime(){

supabaseClient
.channel("exam_results")
.on("postgres_changes",
{event:"*",schema:"public",table:"exam_results"},
payload=>{

if(payload.new && payload.new.examId===currentExamId){

fetchResults();

}

})
.subscribe();

}


/* ================= SELECT EXAM ================= */

document.getElementById("examSelect").addEventListener("change",function(){

currentExamId=this.value;

if(currentExamId){

fetchResults();
subscribeRealtime();

}

});


/* ================= PDF DOWNLOAD ================= */

document.getElementById("downloadBtn").addEventListener("click",()=>{

if(!currentExamId){

alert("Select exam first");

return;

}

const exam=EXAM_STATUS[currentExamId];

const element=document.getElementById("liveTableContainer");

html2pdf().set({

margin:[20,10,20,10],

filename:exam.title+"-Scoreboard.pdf",

html2canvas:{scale:2},

jsPDF:{unit:"pt",format:"a4",orientation:"portrait"}

}).from(element).save();

});


/* ================= START ================= */

window.onload=()=>{

populateExamDropdown();

};

</script>

</body>
</html>

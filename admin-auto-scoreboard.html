<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Live Scoreboard - NTRCA Agriculture</title>
<style>
body{ font-family: Arial,sans-serif; background:#f8f8f8; padding:20px;}
h2{ margin-bottom:20px;}
select, button, input{ padding:8px 12px; font-size:16px; margin-right:10px;}
button{ padding:10px 20px; background:#2E8B57; color:white; border:none; border-radius:6px; cursor:pointer;}
button:hover{ background:#246b45;}
.pdf-container{ width:100%; margin:auto; background:#fff; padding:20px; border-radius:6px;}
.pdf-header{text-align:center; margin-bottom:20px;}
.pdf-header h1{ font-size:22px; margin:0; color:#2E8B57;}
.pdf-header h3{ font-size:16px; margin:5px 0; color:#333;}
table{ width:100%; border-collapse:collapse; margin-top:10px;}
th, td{ border:1px solid #ddd; padding:8px; text-align:center; font-size:14px;}
th{ background:#2E8B57; color:white;}
.pass{background:#d4edda;}
.fail{background:#f8d7da;}
.top-rank{ font-weight:bold; color:#ff8c00; }
</style>
</head>
<body>

<h2>Live Scoreboard - NTRCA Agriculture</h2>

<div id="scoreboardSection">
<select id="examSelect">
<option value="">-- Select Exam --</option>
</select>

<button id="downloadBtn">Download PDF</button>

<div class="pdf-container" id="liveTableContainer">
<div class="pdf-header">
<h1>NTRCA Agriculture Teacher Registration-2026</h1>
<h3 id="examTitleHeader">Exam Title</h3>
<h3 id="examDateHeader"></h3>
</div>

<table id="scoreTable">
<thead>
<tr>
<th>Name (Rank)</th>
<th>Correct</th>
<th>Wrong</th>
<th>Unanswered</th>
<th>Percentage</th>
<th>Result</th>
</tr>
</thead>
<tbody id="scoreBody"></tbody>
</table>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
// ==================== Exam Data ====================
const EXAM_STATUS = {
  "exam-1": { title: "ডেমো পরীক্ষা", visible: true, status: "live", codes: ["krisi"] },
  "exam-2": { title: "HSC 1st Paper 1st Chapter", visible: true, status: "live", codes: ["exam28"] },
  "exam-3": { title: "HSC 1st Paper 2nd Chapter", visible: true, status: "live", codes: ["exam31"] },
  "exam-4": { title: "HSC 1st Paper 3rd Chapter", visible: true, status: "live", codes: ["exam39"] },
  "exam-5": { title: "HSC 1st Paper 4rth Chapter", visible: false, status: "live", codes: ["exam2code"] }
};

// ==================== Dummy Results (demo) ====================
const DUMMY_RESULTS = {
  "exam-1": [
    { name:"Alice", correct:45, wrong:5, unanswered:0, percent:90 },
    { name:"Bob", correct:35, wrong:15, unanswered:0, percent:70 },
    { name:"Charlie", correct:25, wrong:25, unanswered:0, percent:50 },
  ],
  "exam-2": [
    { name:"David", correct:40, wrong:10, unanswered:0, percent:80 },
    { name:"Eve", correct:30, wrong:20, unanswered:0, percent:60 }
  ],
  "exam-3": [],
  "exam-4": [],
};

// ==================== Globals ====================
let currentExamId = "";

// ==================== Populate Exam Dropdown ====================
function initExamDropdown(){
    const examSelect = document.getElementById("examSelect");
    examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
    for(const examId in EXAM_STATUS){
        const exam = EXAM_STATUS[examId];
        if(exam && exam.visible){
            const opt = document.createElement("option");
            opt.value = examId;
            opt.textContent = exam.title;
            examSelect.appendChild(opt);
        }
    }
}

// ==================== Render Scoreboard ====================
function renderScoreboard(examId){
    const tbody = document.getElementById("scoreBody");
    const titleHeader = document.getElementById("examTitleHeader");
    const dateHeader = document.getElementById("examDateHeader");

    const exam = EXAM_STATUS[examId];
    if(!exam) return;

    titleHeader.innerText = "Exam Title: " + exam.title;
    dateHeader.innerText = "Generated: " + new Date().toLocaleString("en-GB");

    let results = DUMMY_RESULTS[examId] || [];
    results.sort((a,b)=>b.correct - a.correct);

    tbody.innerHTML = "";
    results.forEach((r,i)=>{
        const status = r.percent >= 40 ? "PASS" : "FAIL";
        let rank="";
        if(i==0) rank="1st"; else if(i==1) rank="2nd"; else if(i==2) rank="3rd"; else if(i==3) rank="4th"; else if(i==4) rank="5th";
        const name = r.name + (rank ? ` (${rank})` : "");
        const tr = document.createElement("tr");
        if(i<5) tr.classList.add("top-rank");
        tr.classList.add(status==="PASS" ? "pass" : "fail");
        tr.innerHTML=`
            <td>${name}</td>
            <td>${r.correct}</td>
            <td>${r.wrong}</td>
            <td>${r.unanswered}</td>
            <td>${r.percent}%</td>
            <td>${status}</td>
        `;
        tbody.appendChild(tr);
    });
}

// ==================== Event Listeners ====================
document.getElementById("examSelect").addEventListener("change", function(){
    currentExamId = this.value;
    if(currentExamId) renderScoreboard(currentExamId);
});

document.getElementById("downloadBtn").addEventListener("click", ()=>{
    if(!currentExamId){ alert("Please select exam"); return; }
    const element = document.getElementById("liveTableContainer");
    html2pdf().set({
        margin:[20,10,20,10],
        filename: EXAM_STATUS[currentExamId].title+"-Scoreboard.pdf",
        html2canvas:{scale:2},
        jsPDF:{unit:'pt',format:'a4',orientation:'portrait'}
    }).from(element).save();
});

// ==================== Initialize ====================
window.onload = initExamDropdown;
</script>

</body>
</html>

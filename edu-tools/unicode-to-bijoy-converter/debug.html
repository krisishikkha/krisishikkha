<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #000;
            color: #0f0;
        }
        .test {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #0f0;
        }
        .pass { background: #004400; }
        .fail { background: #440000; color: #f00; }
    </style>
</head>
<body>
    <h1>🔧 Diagnostic Test</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function test(name, condition) {
            const div = document.createElement('div');
            div.className = `test ${condition ? 'pass' : 'fail'}`;
            div.textContent = `${condition ? '✅' : '❌'} ${name}`;
            results.appendChild(div);
            return condition;
        }

        // Run tests
        test('JavaScript Loaded', true);
        test('DOM Ready', document.readyState !== 'loading');
        test('getElementById works', !!document.getElementById('results'));
        
        const testInput = document.createElement('input');
        testInput.id = 'testInput';
        document.body.appendChild(testInput);
        test('Can create elements', !!testInput);
        
        let eventFired = false;
        testInput.addEventListener('click', () => eventFired = true);
        testInput.click();
        test('Events work', eventFired);

        // Test Bengali character
        const bengaliTest = 'আমি';
        const bengaliCode = bengaliTest.charCodeAt(0);
        test('Bengali char detection', bengaliCode >= 0x0980 && bengaliCode <= 0x09FF);

        // Test conversion function
        const UNICODE_TO_BIJOY_MAP = {
            'অ': 'A', 'আ': 'Av', 'ই': 'B'
        };
        test('Mapping table exists', Object.keys(UNICODE_TO_BIJOY_MAP).length > 0);
        test('Mapping works', UNICODE_TO_BIJOY_MAP['আ'] === 'Av');

        // Environment info
        const info = document.createElement('div');
        info.className = 'test';
        info.innerHTML = `
            <h3>📊 Environment Info:</h3>
            <strong>User Agent:</strong> ${navigator.userAgent}<br>
            <strong>Platform:</strong> ${navigator.platform}<br>
            <strong>Language:</strong> ${navigator.language}<br>
            <strong>Screen:</strong> ${screen.width}x${screen.height}<br>
            <strong>Viewport:</strong> ${window.innerWidth}x${window.innerHeight}<br>
            <strong>Document Ready State:</strong> ${document.readyState}<br>
        `;
        results.appendChild(info);

        console.log('✅ Debug test completed');
        console.log('All tests passed!');
    </script>
</body>
</html>

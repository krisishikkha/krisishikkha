<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode to Bijoy Converter</title>
    <style>
        /* ========================================
           BASIC STYLES
           ======================================== */
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 0; display: flex; justify-content: center; }
        .wrapper { width: 95%; max-width: 800px; margin-top: 40px; padding: 20px; }
        
        /* Header */
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; }

        /* Cards */
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        textarea { width: 100%; height: 150px; padding: 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; resize: vertical; outline: none; transition: 0.3s; font-family: monospace; }
        textarea:focus { border-color: #007bff; }

        /* Buttons */
        .btn-main { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin: 20px 0; transition: 0.3s; }
        .btn-main:hover { background: #0056b3; transform: translateY(-2px); }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-copy { flex: 1; padding: 10px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-copy:hover { background: #218838; }
        .btn-clear { background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; padding: 10px; width: 100%; font-size: 14px; }
        
        /* Output Area */
        #outputArea { min-height: 120px; padding: 15px; border: 2px dashed #ccc; border-radius: 8px; background: #fafafa; word-wrap: break-word; line-height: 1.6; }
        
        /* Status Message */
        #statusMsg { text-align: center; font-size: 14px; margin-bottom: 10px; display: none; padding: 8px; border-radius: 4px; }
        .msg-success { background: #d4edda; color: #155724; }
        .msg-error { background: #f8d7da; color: #721c24; }

        /* Footer */
        footer { text-align: center; margin-top: 30px; color: #777; font-size: 13px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>🔤 Bijoy Converter</h1>
    <p class="subtitle">বাংলা → SutonnyMJ | ইংরেজি → Calibri</p>

    <!-- Input Box -->
    <div class="box">
        <textarea id="inputText" placeholder="এখানে বাংলা বা ইংরেজি লিখুন..."></textarea>
        <div class="char-count" style="text-align: right; font-size: 12px; margin-top:5px; color:#999;">Characters: <span id="charCount">0</span></div>
        
        <button class="btn-main" id="convertBtn">⚡ CONVERT TO BIJOY</button>

        <div class="btn-group">
            <button class="btn-copy" id="copyPlainBtn">📋 Copy Plain</button>
            <button class="btn-copy" id="copyRichBtn">📄 Copy (With Fonts)</button>
        </div>
        <button class="btn-clear" id="clearBtn">❌ Clear All</button>
    </div>

    <!-- Output Box -->
    <div class="box">
        <div id="statusMsg"></div>
        <label style="font-weight:bold; display:block; margin-bottom:5px;">Output Result:</label>
        <div id="outputArea"></div>
    </div>

    <footer>Made for KrisiShikkha Project</footer>
</div>

<!-- ======================= 
     SCRIPT LOGIC
     ======================= -->
<script>
(function() {
    console.log("Converter Ready");

    // Mapping Data
    const unicodeMap = {
        'অ':'A','আ':'Av','ই':'B','ঈ':'C','উ':'D','ঊ':'E','ঋ':'F','এ':'G','ঐ':'H','ও':'I','ঔ':'J',
        'ক':'K','খ':'L','গ':'M','ঘ':'N','ঙ':'O','চ':'P','ছ':'Q','জ':'R','ঝ':'S','ঞ':'T',
        'ট':'U','ঠ':'V','ড':'W','ঢ':'X','ণ':'Y','ত':'Z','থ':'_','দ':'`','ধ':'a','ন':'b',
        'প':'c','ফ':'d','ব':'e','ভ':'f','ম':'g','য':'h','র':'i','ল':'j','শ':'k','ষ':'l','স':'m','হ':'n',
        'ড়':'o','ঢ়':'p','য়':'q','ৎ':'r','ং':'s','ঃ':'t','ঁ':'u',
        'া':'v','ি':'w','ী':'x','ু':'y','ূ':'z','ৃ':'…','ে':'†','ৈ':'‡','ো':'†v','ৌ':'‡v',
        '্':'&',
        '০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9',
        '।':'|','॥':'||'
    };
    
    // Common Conjunct Fixes
    const conjuncts = { 'ক্ষ': '¶', 'ত্র': 'Í', 'দ্দ': 'Ï', 'দ্ধ': 'Ð' };

    // Elements
    const els = {
        inp: document.getElementById('inputText'),
        out: document.getElementById('outputArea'),
        btn: document.getElementById('convertBtn'),
        chCnt: document.getElementById('charCount'),
        status: document.getElementById('statusMsg'),
        plainBtn: document.getElementById('copyPlainBtn'),
        richBtn: document.getElementById('copyRichBtn'),
        clearBtn: document.getElementById('clearBtn')
    };

    let resultData = null;

    // Helper: Check if character is Bengali
    function isBengali(char) {
        return char.charCodeAt(0) >= 0x0980 && char.charCodeAt(0) <= 0x09FF;
    }

    // Helper: Reorder Matra (Simple Logic for Stability)
    function reprocess(text) {
        let arr = text.split('');
        // Pre-base matras fix (simple version)
        for(let i=arr.length-1; i>=0; i--) {
            if(['ি','ী','ে','ৈ'].includes(arr[i])) {
                // Try to move before consonant (basic check for stability)
                // We will keep mapped characters as is mostly to prevent errors
            }
        }
        let res = "";
        for(let c of arr) {
            // Apply mapping
            res += unicodeMap[c] || c;
            // Apply conjunct replacements after mapping if needed
        }
        // Replace Conjuncts
        Object.keys(conjuncts).forEach(k => { res = res.replace(new RegExp(k, 'g'), conjuncts[k]); });
        return res;
    }

    // Main Conversion Function
    els.btn.addEventListener('click', () => {
        let input = els.inp.value.trim();
        if(!input) { alert("Please write something first!"); return; }

        els.btn.textContent = "Converting..."; els.btn.disabled = true;

        setTimeout(() => {
            let segs = [];
            let temp = "";
            let prevType = null;

            // Segment Bengali vs English
            for(let i=0; i<input.length; i++) {
                let type = isBengali(input[i]) ? 'bengali' : 'english';
                if(type !== prevType) {
                    if(temp) segs.push({type: prevType, text: temp});
                    temp = input[i];
                    prevType = type;
                } else {
                    temp += input[i];
                }
            }
            if(temp) segs.push({type: prevType, text: temp});

            // Build Result
            let plainResult = "";
            let htmlResult = "";

            segs.forEach(seg => {
                if(seg.type === 'bengali') {
                    let processed = reprocess(seg.text);
                    plainResult += processed;
                    // FORCE SUTONNYMJ FONT HERE
                    htmlResult += `<span style="font-family:'SutonnyMJ', Arial, sans-serif; font-size:16px; font-weight:normal;">${processed}</span>`;
                } else {
                    plainResult += seg.text;
                    // FORCE CALIBRI FONT HERE
                    htmlResult += `<span style="font-family:'Calibri', 'Arial', sans-serif; font-size:15px; font-weight:normal;">${seg.text}</span>`;
                }
            });

            resultData = { plain: plainResult, html: htmlResult };

            // Display
            els.out.innerHTML = htmlResult;
            els.chCnt.innerText = resultData.plain.length;
            
            // Success Msg
            showStatus("Converted Successfully! ✅", "#d4edda");
            els.btn.textContent = "⚡ CONVERT TO BIJOY";
            els.btn.disabled = false;

        }, 100);
    });

    // Copy Functions
    async function copyToClipboard(isRich) {
        if(!resultData) { alert("Nothing to copy! Click Convert first."); return; }
        try {
            if(isRich) {
                // Copy Rich Text (HTML + Plain) - Works in MS Word
                const blob = new Blob([resultData.html], {type: 'text/html'});
                const item = new ClipboardItem({
                    'text/html': blob,
                    'text/plain': new Blob([resultData.plain])
                });
                await navigator.clipboard.write([item]);
                showStatus("Copied with Fonts! Paste in Word. 📄", "#d4edda");
            } else {
                await navigator.clipboard.writeText(resultData.plain);
                showStatus("Plain Text Copied! 📋", "#d4edda");
            }
        } catch(err) {
            alert("Copy failed. Please try manually selecting.");
            console.error(err);
        }
    }

    els.plainBtn.addEventListener('click', () => copyToClipboard(false));
    els.richBtn.addEventListener('click', () => copyToClipboard(true));

    els.clearBtn.addEventListener('click', () => {
        els.inp.value = '';
        els.out.innerHTML = '';
        resultData = null;
        els.chCnt.innerText = '0';
    });

    function showStatus(msg, color) {
        els.status.style.display = 'block';
        els.status.className = ''; // reset
        els.status.classList.add(color === '#d4edda' ? 'msg-success' : 'msg-error');
        els.status.textContent = msg;
        setTimeout(() => { els.status.style.display = 'none'; }, 3000);
    }
})();
</script>

</body>
</html>

  <style>
    body{
      font-family: Georgia, serif;
      background:#f3f3f3;
      margin:0;
      padding:0;
    }
    .container{
      max-width:1000px;
      margin:auto;
      padding:20px;
    }
    
    /* Header */
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 25px;
      background: linear-gradient(135deg, #d84315, #ff8a65);
      color: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }
    
    h1{
      font-size:28px;
      margin:0 0 10px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .subtitle {
      font-size: 15px;
      opacity: 0.95;
      margin: 5px 0;
    }
    
    /* Back Button */
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #2e7d32;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }
    
    .back-btn:hover {
      background: #1b5e20;
      transform: translateX(-3px);
    }
    
    /* Institute Grid */
    .institute-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    
    .institute-card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      transition: 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      color: #333;
      border: 2px solid transparent;
    }
    
    .institute-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 22px rgba(0,0,0,0.15);
    }
    
    .institute-card .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    
    .institute-card h3 {
      margin: 10px 0 5px 0;
      font-size: 18px;
      color: #d84315;
    }
    
    .institute-card .full-name {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }
    
    /* Different Border Colors */
    .institute-card:nth-child(1) { border-color: #1b5e20; }
    .institute-card:nth-child(2) { border-color: #0d47a1; }
    .institute-card:nth-child(3) { border-color: #6a1b9a; }
    .institute-card:nth-child(4) { border-color: #c62828; }
    .institute-card:nth-child(5) { border-color: #ef6c00; }
    .institute-card:nth-child(6) { border-color: #00838f; }
    .institute-card:nth-child(7) { border-color: #283593; }
    .institute-card:nth-child(8) { border-color: #558b2f; }
    .institute-card:nth-child(9) { border-color: #ad1457; }
    .institute-card:nth-child(10) { border-color: #4e342e; }
    .institute-card:nth-child(11) { border-color: #37474f; }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #666;
    }
    
    /* Footer */
    footer {
      margin-top: 60px;
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
    
    footer a {
      color: #d84315;
      text-decoration: none;
    }
    
    @media (max-width: 600px) {
      h1 { font-size: 22px; }
      .institute-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
    }
  </style>
</head>

<body>

<div class="container">
  
  <a href="../index.html" class="back-btn">← হোমে ফিরুন</a>
  
  <div class="header">
    <h1>📋 Question Bank - SO/AD</h1>
    <p class="subtitle">Scientific Officer ও Assistant Director পরীক্ষার প্রশ্ন সংগ্রহ</p>
    <p class="subtitle">সকল কৃষি গবেষণা প্রতিষ্ঠানের প্রশ্ন এক জায়গায়</p>
  </div>

  <div id="instituteContainer" class="institute-grid">
    <div class="loading">⏳ Institute list লোড হচ্ছে...</div>
  </div>

  <footer>
    <p>© 2024 Krisishikkha | <a href="../about.html">About</a> | <a href="../contact.html">Contact</a></p>
  </footer>

</div>

<script src="js/config.js"></script>
<script>
  // Load Institutes from JSON
  async function loadInstitutes() {
    try {
      const response = await fetch('data/institutes.json');
      const data = await response.json();
      
      const container = document.getElementById('instituteContainer');
      container.innerHTML = '';
      
      data.institutes
        .filter(inst => inst.visible)
        .forEach(institute => {
          const card = document.createElement('a');
          card.className = 'institute-card';
          card.href = `institute.html?id=${institute.id}`;
          
          card.innerHTML = `
            <div class="icon">${institute.icon}</div>
            <h3>${institute.nameEn}</h3>
            <div class="full-name">${institute.nameBn}</div>
          `;
          
          container.appendChild(card);
        });
        
    } catch (error) {
      document.getElementById('instituteContainer').innerHTML = 
        '<div class="loading" style="color:red;">❌ Error loading institutes</div>';
      console.error('Error:', error);
    }
  }
  
  loadInstitutes();
</script>

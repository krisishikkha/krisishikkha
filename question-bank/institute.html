<!DOCTYPE html>
<html lang="bn">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LGK67QBZD3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LGK67QBZD3');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  
  <title id="pageTitle">Question Sets | Krisishikkha</title>

  <style>
    body{
      font-family: Georgia, serif;
      background:#f3f3f3;
      margin:0;
      padding:0;
    }
    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }
    
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #2e7d32;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }
    
    .back-btn:hover {
      background: #1b5e20;
      transform: translateX(-3px);
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 25px;
      background: linear-gradient(135deg, #d84315, #ff8a65);
      color: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }
    
    h1{
      font-size:26px;
      margin:0 0 8px 0;
    }
    
    .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }
    
    /* Question Set Cards */
    .sets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    
    .set-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      transition: 0.25s ease;
      border-left: 5px solid #d84315;
      position: relative;
    }
    
    .set-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    
    .set-card h3 {
      margin: 0 0 12px 0;
      font-size: 18px;
      color: #d84315;
    }
    
    .set-info {
      font-size: 13px;
      color: #666;
      margin: 5px 0;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-right: 8px;
      margin-top: 10px;
    }
    
    .badge.free {
      background: #e8f5e9;
      color: #2e7d32;
    }
    
    .badge.premium {
      background: #fff3e0;
      color: #ef6c00;
    }
    
    .format-badges {
      margin-top: 12px;
    }
    
    .format-badge {
      display: inline-block;
      padding: 6px 12px;
      margin: 5px 5px 0 0;
      background: #e3f2fd;
      color: #1565c0;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
    }
    
    .format-badge:hover {
      background: #1565c0;
      color: white;
    }
    
    .format-badge.locked {
      background: #f5f5f5;
      color: #999;
      cursor: not-allowed;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #666;
    }
    
    @media (max-width: 600px) {
      .sets-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<div class="container">
  
  <a href="index.html" class="back-btn">← Institute List</a>
  
  <div class="header">
    <h1 id="instituteName">Loading...</h1>
    <p class="subtitle" id="instituteNameBn"></p>
  </div>

  <div id="setsContainer">
    <div class="loading">⏳ Question sets লোড হচ্ছে...</div>
  </div>

</div>


<script src="js/premium.js"></script>
<script>
  // Get Institute ID from URL
  const urlParams = new URLSearchParams(window.location.search);
  const instituteId = urlParams.get('id');
  
  console.log('Institute ID:', instituteId);
  
  if (!instituteId) {
    alert('Institute ID missing!');
    window.location.href = 'index.html';
  }
  
  async function loadInstitute() {
    try {
      // Load institute info
      console.log('Loading institutes.json...');
      const instResponse = await fetch('data/institutes.json');
      
      if (!instResponse.ok) {
        throw new Error('Failed to load institutes.json');
      }
      
      const instData = await instResponse.json();
      const institute = instData.institutes.find(i => i.id === instituteId);
      
      if (!institute) {
        throw new Error('Institute not found: ' + instituteId);
      }
      
      console.log('Institute found:', institute);
      
      document.getElementById('instituteName').textContent = institute.nameEn;
      document.getElementById('instituteNameBn').textContent = institute.nameBn;
      document.title = `${institute.nameEn} - Question Sets | Krisishikkha`;
      
      // Load question sets
      const setsURL = `data/${instituteId}/sets.json`;
      console.log('Loading sets from:', setsURL);
      
      const setsResponse = await fetch(setsURL);
      
      if (!setsResponse.ok) {
        throw new Error(`Failed to load ${setsURL} - Status: ${setsResponse.status}`);
      }
      
      const setsData = await setsResponse.json();
      console.log('Sets loaded:', setsData);
      
      const container = document.getElementById('setsContainer');
      container.innerHTML = '';
      
      const visibleSets = setsData.sets.filter(set => set.visible);
      
      if (visibleSets.length === 0) {
        container.innerHTML = '<div class="loading">কোনো Question Set পাওয়া যায়নি</div>';
        return;
      }
      
      visibleSets.forEach(set => {
        const card = document.createElement('div');
        card.className = 'set-card';
        
        let formatsHTML = '';
        set.format.forEach(fmt => {
          if (fmt === 'article') {
            formatsHTML += `
              <a href="#" onclick="openArticle('${instituteId}', '${set.id}', '${set.type}'); return false;" 
                 class="format-badge">
                📄 Article পড়ুন
              </a>
            `;
          } else if (fmt === 'pdf') {
            formatsHTML += `
              <a href="pdf/${instituteId}/${set.id}.pdf" target="_blank" 
                 class="format-badge">
                📥 PDF Download
              </a>
            `;
          }
        });
        
        card.innerHTML = `
          <h3>${set.title}</h3>
          <div class="set-info">📝 মোট প্রশ্ন: ${set.totalQuestions}টি</div>
          <div>
            <span class="badge ${set.type}">${set.type === 'free' ? '🆓 Free' : '⭐ Premium'}</span>
          </div>
          <div class="format-badges">
            ${formatsHTML}
          </div>
        `;
        
        container.appendChild(card);
      });
        
    } catch (error) {
      console.error('Error details:', error);
      document.getElementById('setsContainer').innerHTML = 
        `<div class="loading" style="color:red;">❌ Error: ${error.message}<br><small>Check browser console for details</small></div>`;
    }
  }
  
  function openArticle(instituteId, setId, type) {
    if (type === 'premium' && !checkPremiumAccess()) {
      showPremiumModal();
      return;
    }
    
    window.location.href = `article.html?institute=${instituteId}&set=${setId}`;
  }
  
  // Load on page ready
  loadInstitute();
</script>
</body>
</html>

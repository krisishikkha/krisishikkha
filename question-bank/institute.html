<!DOCTYPE html>
<html lang="bn">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LGK67QBZD3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-LGK67QBZD3');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  
  <title id="pageTitle">Question Sets | Krisishikkha</title>

  <!-- Premium Modal CSS -->
  <link rel="stylesheet" href="css/premium.css">

  <style>
    * {
      box-sizing: border-box;
    }
    
    body{
      font-family: Georgia, serif;
      background:#f3f3f3;
      margin:0;
      padding:0;
    }
    
    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }
    
    /* Back Button */
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 20px;
      background: #2e7d32;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    
    .back-btn:hover {
      background: #1b5e20;
      transform: translateX(-3px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }
    
    /* Header */
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 25px;
      background: linear-gradient(135deg, #d84315, #ff8a65);
      color: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }
    
    h1{
      font-size:26px;
      margin:0 0 8px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }
    
    /* Question Set Cards Grid */
    .sets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 30px;
    }
    
    /* ================================
       NEW PREMIUM CARD DESIGN
       ================================ */
    
    .set-card {
      background: #FFFFFF;
      border: 1.5px solid #E5E5E5;
      border-radius: 24px;
      padding: 24px;
      cursor: pointer;
      transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04),
                  0 1px 3px rgba(0, 0, 0, 0.02);
      position: relative;
      overflow: hidden;
    }
    
    .set-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08),
                  0 4px 12px rgba(0, 0, 0, 0.04);
      border-color: #D0D0D0;
    }
    
    .set-card:active {
      transform: translateY(-2px) scale(0.98);
      transition: all 150ms ease;
    }
    
    /* Ripple Effect Container */
    .set-card::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.05);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .set-card:active::before {
      width: 300px;
      height: 300px;
    }
    
    /* Card Header */
    .card-header {
      margin-bottom: 16px;
    }
    
    /* Exam Title */
    .set-card h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.4;
    }
    
    /* Year & Question Info */
    .set-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    
    .set-year {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    
    .set-info {
      font-size: 13px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    /* Badge Container */
    .badge-container {
      margin: 12px 0;
    }
    
    /* Premium / Free Badge - Chip Style */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    
    .badge.free {
      background: #E8F5E9;
      color: #2E7D32;
    }
    
    .badge.premium {
      background: #FFF8E1;
      color: #F57F17;
    }
    
    .badge.premium::before {
      content: '⭐';
      font-size: 12px;
    }
    
    /* Buttons Container */
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    
    /* Action Buttons - Modern Style */
    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms ease;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    
    /* Article Button */
    .btn-article {
      background: #E3F2FD;
      color: #1565C0;
    }
    
    .btn-article:hover {
      background: #BBDEFB;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.2);
    }
    
    .btn-article:active {
      transform: translateY(0) scale(0.98);
    }
    
    /* PDF Button */
    .btn-pdf {
      background: #E3F2FD;
      color: #1565C0;
    }
    
    .btn-pdf:hover {
      background: #BBDEFB;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.2);
    }
    
    .btn-pdf:active {
      transform: translateY(0) scale(0.98);
    }
    
    /* Button Icons */
    .btn-icon {
      font-size: 16px;
    }
    
    /* Button Ripple Effect */
    .action-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.1);
      transform: translate(-50%, -50%);
      transition: width 0.4s, height 0.4s;
      z-index: -1;
    }
    
    .action-btn:active::before {
      width: 200px;
      height: 200px;
    }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #666;
    }
    
    .loading::before {
      content: '';
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #d84315;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Error Message */
    .error-message {
      text-align: center;
      padding: 40px 20px;
      color: #c62828;
      font-size: 16px;
      background: #ffebee;
      border-radius: 10px;
      margin: 20px 0;
    }
    
    /* Footer */
    footer {
      margin-top: 60px;
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
    
    footer a {
      color: #d84315;
      text-decoration: none;
    }
    
    footer a:hover {
      text-decoration: underline;
    }
    
    /* Responsive Design */
    @media (max-width: 600px) {
      .sets-grid { 
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      h1 {
        font-size: 22px;
      }
      
      .header {
        padding: 20px 15px;
      }
      
      .set-card {
        padding: 20px;
        border-radius: 20px;
      }
      
      .set-card h3 {
        font-size: 17px;
      }
      
      .card-actions {
        flex-direction: column;
      }
      
      .action-btn {
        width: 100%;
      }
    }
    
    @media (min-width: 601px) and (max-width: 900px) {
      .sets-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">
  
  <a href="index.html" class="back-btn">← Institute List</a>
  
  <div class="header">
    <h1 id="instituteName">Loading...</h1>
    <p class="subtitle" id="instituteNameBn"></p>
  </div>

  <div id="setsContainer">
    <div class="loading">Question sets লোড হচ্ছে...</div>
  </div>

  <footer>
    <p>© 2024 Krisishikkha | <a href="../about.html">About</a> | <a href="../contact.html">Contact</a></p>
  </footer>

</div>

<!-- Premium Modal Script -->
<script src="js/premium.js"></script>

<script>
  // Get Institute ID from URL
  const urlParams = new URLSearchParams(window.location.search);
  const instituteId = urlParams.get('id');
  
  console.log('Institute ID:', instituteId);
  
  if (!instituteId) {
    alert('Institute ID missing!');
    window.location.href = 'index.html';
  }
  
  async function loadInstitute() {
    try {
      // Load institute info
      console.log('Loading institutes.json...');
      const instResponse = await fetch('data/institutes.json');
      
      if (!instResponse.ok) {
        throw new Error('Failed to load institutes.json');
      }
      
      const instData = await instResponse.json();
      const institute = instData.institutes.find(i => i.id === instituteId);
      
      if (!institute) {
        throw new Error('Institute not found: ' + instituteId);
      }
      
      console.log('Institute found:', institute);
      
      document.getElementById('instituteName').textContent = institute.nameEn;
      document.getElementById('instituteNameBn').textContent = institute.nameBn;
      document.title = `${institute.nameEn} - Question Sets | Krisishikkha`;
      
      // Load question sets
      const setsURL = `data/${instituteId}/sets.json`;
      console.log('Loading sets from:', setsURL);
      
      const setsResponse = await fetch(setsURL);
      
      if (!setsResponse.ok) {
        throw new Error(`Failed to load ${setsURL} - Status: ${setsResponse.status}`);
      }
      
      const setsData = await setsResponse.json();
      console.log('Sets loaded:', setsData);
      
      const container = document.getElementById('setsContainer');
      container.innerHTML = '';
      
      const visibleSets = setsData.sets.filter(set => set.visible);
      
      if (visibleSets.length === 0) {
        container.innerHTML = '<div class="loading">কোনো Question Set পাওয়া যায়নি</div>';
        return;
      }
      
      visibleSets.forEach(set => {
        const card = document.createElement('div');
        card.className = 'set-card';
        
        // Make entire card clickable (except PDF button)
        card.addEventListener('click', function(e) {
          // Check if click is on PDF button or its children
          if (e.target.closest('.btn-pdf')) {
            return; // Let PDF button handle its own click
          }
          
          // Otherwise open article
          openArticle(instituteId, set.id, set.type);
        });
        
        // Build buttons HTML
        let buttonsHTML = '';
        
        // Article button (always present)
        buttonsHTML += `
          <button class="action-btn btn-article" onclick="event.stopPropagation();">
            <span class="btn-icon">📄</span>
            <span>Article পড়ুন</span>
          </button>
        `;
        
        // PDF button (if PDF format exists)
        if (set.format.includes('pdf')) {
          buttonsHTML += `
            <a href="pdf/${instituteId}/${set.id}.pdf" 
               target="_blank" 
               class="action-btn btn-pdf"
               onclick="event.stopPropagation();">
              <span class="btn-icon">📥</span>
              <span>PDF Download</span>
            </a>
          `;
        }
        
        // Card content
        card.innerHTML = `
          <div class="card-header">
            <h3>${set.title}</h3>
            <div class="set-meta">
              <span class="set-year">📅 ${set.year}</span>
              <span class="set-info">
                <span>📝</span>
                <span>${set.totalQuestions}টি প্রশ্ন</span>
              </span>
            </div>
          </div>
          
          <div class="badge-container">
            <span class="badge ${set.type}">
              ${set.type === 'free' ? '🆓 Free' : 'Premium'}
            </span>
          </div>
          
          <div class="card-actions">
            ${buttonsHTML}
          </div>
        `;
        
        container.appendChild(card);
      });
        
    } catch (error) {
      console.error('Error details:', error);
      document.getElementById('setsContainer').innerHTML = 
        `<div class="error-message">
          ❌ Error: ${error.message}
          <br><small>Check browser console for details</small>
        </div>`;
    }
  }
  
  function openArticle(instituteId, setId, type) {
    // Check premium access
    if (type === 'premium' && !checkPremiumAccess()) {
      showPremiumModal();
      return;
    }
    
    // Open article page
    window.location.href = `article.html?institute=${instituteId}&set=${setId}`;
  }
  
  // Load on page ready
  loadInstitute();
</script>

</body>
    </html>

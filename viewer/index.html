<!DOCTYPE html>
<html lang="bn">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LGK67QBZD3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LGK67QBZD3');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer - কৃষি শিক্ষা</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loadingText {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
        }

        /* Progress Bar */
        #progressBox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        #progressInfo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        #progressPercent {
            color: #4CAF50;
            font-size: 16px;
        }

        #pageInfo {
            font-size: 13px;
            color: #666;
        }

        /* PDF Container */
        #pdfContainer {
            padding-top: 60px;
            padding-bottom: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        canvas {
            display: block;
            margin: 15px auto;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            border-radius: 4px;
            background: #fff;
            max-width: 100%;
            height: auto !important;
        }

        /* Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-35deg);
            font-size: 32px;
            color: rgba(0,0,0,0.08);
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
            user-select: none;
        }

        /* Install Button */
        #installBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 99999;
            display: none;
            transition: all 0.3s ease;
        }

        #installBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        /* Error Message */
        #errorBox {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
            display: none;
            z-index: 99999;
        }

        #errorBox h2 {
            color: #f44336;
            margin-bottom: 10px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #progressBox {
                height: 45px;
                padding: 0 10px;
            }

            #progressInfo {
                gap: 10px;
                font-size: 12px;
            }

            .watermark {
                font-size: 20px;
            }

            #pdfContainer {
                padding-top: 55px;
            }

            canvas {
                margin: 10px auto;
            }
        }
    </style>

    <!-- PDF.js CDN (সবচেয়ে স্থিতিশীল) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <div id="loadingText">PDF লোড হচ্ছে...</div>
    </div>

    <!-- Error Box -->
    <div id="errorBox">
        <h2>❌ ত্রুটি!</h2>
        <p id="errorMessage"></p>
    </div>

    <!-- Progress Bar -->
    <div id="progressBox">
        <div id="progressInfo">
            <span>📖 পড়া হয়েছে:</span>
            <span id="progressPercent">0%</span>
        </div>
        <div id="pageInfo">পৃষ্ঠা: <span id="currentPage">0</span>/<span id="totalPages">0</span></div>
    </div>

    <!-- Watermark -->
    <div class="watermark">কৃষি শিক্ষা ডট কম</div>

    <!-- PDF Container -->
    <div id="pdfContainer"></div>

    <!-- Install Button -->
    <div id="installBtn">
        📲 অ্যাপ ইনস্টল করুন
    </div>

    <script src="viewer.js"></script>

</body>
</html>

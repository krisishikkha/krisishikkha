<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Download Center - Final Answer PDF</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;
      padding:20px;
      background:#f4f4f4;
      color:#111;
    }

    h2{
      margin:0 0 20px 0;
      font-size:24px;
    }

    .control-bar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:20px;
    }

    select, button{
      padding:12px 14px;
      font-size:17px;
      border:1px solid #ccc;
      border-radius:6px;
      box-sizing:border-box;
    }

    button{
      background:#2E8B57;
      color:#fff;
      border:none;
      cursor:pointer;
    }

    button:hover{
      background:#246b45;
    }

    button:disabled{
      background:#999;
      cursor:not-allowed;
    }

    .status-message{
      padding:12px;
      border-radius:6px;
      margin-bottom:15px;
      display:none;
    }

    .status-success{
      background:#d4edda;
      color:#155724;
      border:1px solid #c3e6cb;
    }

    .status-error{
      background:#f8d7da;
      color:#721c24;
      border:1px solid #f5c6cb;
    }

    .status-info{
      background:#d1ecf1;
      color:#0c5460;
      border:1px solid #bee5eb;
    }

    .pdf-root{
      width:794px;
      margin:0 auto;
      background:#fff;
      color:#111;
    }

    /* ===== COVER PAGE ===== */
    .cover-page{
      height:1123px;
      box-sizing:border-box;
      padding:80px 55px;
      text-align:center;
      position:relative;
      background:#fff;
      page-break-after:always;
      overflow:hidden;
    }

    .cover-watermark{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%) rotate(-25deg);
      font-size:90px;
      color:rgba(0,0,0,0.04);
      font-weight:700;
      white-space:nowrap;
      pointer-events:none;
      user-select:none;
    }

    .cover-logo{
      width:115px;
      height:115px;
      object-fit:contain;
      margin-top:80px;
      margin-bottom:20px;
    }

    .cover-title{
      font-size:34px;
      font-weight:700;
      color:#1f6f46;
      line-height:1.4;
      margin-bottom:10px;
    }

    .cover-subtitle{
      font-size:22px;
      font-weight:600;
      margin-bottom:22px;
    }

    .cover-line{
      width:180px;
      height:4px;
      background:#1f6f46;
      margin:20px auto 25px auto;
      border-radius:10px;
    }

    .cover-meta{
      font-size:19px;
      line-height:2;
    }

    .cover-footer{
      margin-top:40px;
      font-size:17px;
      color:#444;
    }

    /* ===== CONTENT SECTION ===== */
    .content-section{
      position:relative;
      background:#fff;
      padding:20px 24px 28px 24px;
      box-sizing:border-box;
    }

    .content-watermark{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%) rotate(-25deg);
      font-size:84px;
      color:rgba(0,0,0,0.035);
      font-weight:700;
      white-space:nowrap;
      pointer-events:none;
      user-select:none;
      z-index:0;
    }

    .content-title{
      text-align:center;
      font-size:20px;
      font-weight:700;
      color:#1f6f46;
      margin-bottom:4px;
      position:relative;
      z-index:2;
    }

    .content-sub{
      text-align:center;
      font-size:15px;
      color:#333;
      margin-bottom:12px;
      position:relative;
      z-index:2;
    }

    /* ===== 2 COLUMN LAYOUT ===== */
    .question-grid{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns: 1fr 6px 1fr;
      column-gap:0;
      align-items:start;
    }

    .divider{
      background:#111;
      border-radius:4px;
      min-height:100%;
    }

    .col{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .left-col{
      padding-right:8px;
    }

    .right-col{
      padding-left:8px;
    }

    .qbox{
      border:1px solid #d6d6d6;
      border-radius:7px;
      background:#fffefb;
      padding:10px;
      box-sizing:border-box;
      break-inside:avoid;
      page-break-inside:avoid;
      -webkit-column-break-inside:avoid;
    }

    .qtitle{
      font-size:15px;
      font-weight:700;
      line-height:1.45;
      margin-bottom:6px;
    }

    .option{
      font-size:14px;
      line-height:1.45;
      margin:0 0 4px 16px;
    }

    .correct-option{
      color:#168347;
      font-weight:700;
    }

    .explanation{
      margin-top:7px;
      background:#f1f1f1;
      border-left:4px solid #2E8B57;
      padding:7px 8px;
      border-radius:4px;
      font-size:13px;
      line-height:1.5;
    }

    .footer-note{
      text-align:center;
      font-size:11px;
      color:#555;
      margin-top:16px;
      position:relative;
      z-index:2;
    }
  </style>
</head>
<body>

  <h2>Admin Download Center - Final Answer PDF</h2>

  <div id="statusMessage" class="status-message"></div>

  <div class="control-bar">
    <select id="examSelect">
      <option value="">-- Loading Exams --</option>
    </select>
    <button id="downloadBtn">Download PDF</button>
  </div>

  <script src="exam-status.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    const examSelect = document.getElementById("examSelect");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusMessage = document.getElementById("statusMessage");

    // ✅ Better BASE_PATH detection
    function getBasePath() {
      const hostname = window.location.hostname;
      const pathname = window.location.pathname;

      // Custom domain check
      if (hostname.includes("krisishikkha.com")) {
        return "";
      }
      
      // If running on localhost or subdirectory, detect from pathname
      if (pathname.includes("/krisishikkha/")) {
        return "/krisishikkha";
      }
      
      // Default to root
      return "";
    }

    const BASE_PATH = getBasePath();
    console.log("📁 BASE_PATH detected:", BASE_PATH || "(root)");
    console.log("🌐 Current hostname:", window.location.hostname);
    console.log("📍 Current pathname:", window.location.pathname);

    // Status message display function
    function showStatus(message, type = 'info') {
      statusMessage.textContent = message;
      statusMessage.className = `status-message status-${type}`;
      statusMessage.style.display = 'block';
      
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 5000);
    }

    // Wait for EXAM_STATUS to load
    function waitForExamStatus(callback, timeout = 5000) {
      const startTime = Date.now();
      
      const checkInterval = setInterval(() => {
        if (typeof window.EXAM_STATUS !== "undefined" && Object.keys(window.EXAM_STATUS).length > 0) {
          clearInterval(checkInterval);
          callback();
          return;
        }
        
        if (Date.now() - startTime > timeout) {
          clearInterval(checkInterval);
          showStatus("⚠️ exam-status.js লোড হয়নি। দয়া করে পেজ রিলোড করুন।", "error");
          console.error("❌ EXAM_STATUS not loaded after", timeout, "ms");
        }
      }, 100);
    }

    // Populate exam dropdown
    function populateExamDropdown() {
      if (typeof window.EXAM_STATUS === "undefined") {
        showStatus("❌ EXAM_STATUS সংজ্ঞায়িত নয়! exam-status.js লোড হয়েছে কি?", "error");
        console.error("❌ EXAM_STATUS is undefined");
        return;
      }

      examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
      let count = 0;

      try {
        for (const examId in window.EXAM_STATUS) {
          const exam = window.EXAM_STATUS[examId];
          
          // Only show live exams
          if (exam.visible && (exam.status === "live" || exam.status === "upcoming" || exam.status === "ended")) {
            const option = document.createElement("option");
            option.value = examId;
            option.textContent = exam.title;
            examSelect.appendChild(option);
            count++;
          }
        }
        
        console.log(`✅ Populated ${count} exams`);

        if (count === 0) {
          showStatus("⚠️ কোন পরীক্ষা পাওয়া যায়নি!", "error");
          const option = document.createElement("option");
          option.textContent = "-- No exams available --";
          option.disabled = true;
          examSelect.appendChild(option);
        }
      } catch (err) {
        console.error("❌ Error populating dropdown:", err);
        showStatus("❌ ড্রপডাউন পূরণে ত্রুটি: " + err.message, "error");
      }
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function clearOldQuestionScripts() {
      const oldScripts = document.querySelectorAll('script[data-question-loader="true"]');
      oldScripts.forEach(s => s.remove());
      if (window.QUESTIONS) {
        delete window.QUESTIONS;
      }
    }

    function loadQuestionsJS(path) {
      return new Promise((resolve, reject) => {
        clearOldQuestionScripts();
        
        const script = document.createElement("script");
        script.src = path + "?t=" + Date.now();
        script.dataset.questionLoader = "true";
        
        script.onload = () => {
          console.log("✅ Questions loaded from:", path);
          resolve();
        };
        
        script.onerror = () => {
          console.error("❌ Failed to load:", path);
          reject(new Error("questions.js not found at: " + path));
        };
        
        document.body.appendChild(script);
      });
    }

    function getQuestionsArray() {
      if (typeof window.QUESTIONS !== "undefined" && Array.isArray(window.QUESTIONS)) {
        console.log("✅ Found QUESTIONS array, length:", window.QUESTIONS.length);
        return window.QUESTIONS;
      }
      console.error("❌ QUESTIONS array not found");
      return null;
    }

    function buildCoverPage(selectedExam, questions) {
      const examTitle = window.EXAM_STATUS[selectedExam].title;

      const cover = document.createElement("div");
      cover.className = "cover-page";
      
      const logoPath = BASE_PATH ? `${BASE_PATH}/assets/icons/icon-192.png` : "/assets/icons/icon-192.png";
      
      cover.innerHTML = `
        <div class="cover-watermark">krisishikkha.com</div>
        <img src="${logoPath}" alt="Logo" class="cover-logo" onerror="this.style.display='none'">
        <div class="cover-title">${escapeHtml(examTitle)}</div>
        <div class="cover-subtitle">Answer Sheet with Detailed Explanation</div>
        <div class="cover-line"></div>
        <div class="cover-meta">
          <div><strong>ওয়েবসাইট:</strong> krisishikkha.com</div>
          <div><strong>তারিখ:</strong> ${new Date().toLocaleDateString("bn-BD")}</div>
          <div><strong>মোট প্রশ্ন:</strong> ${questions.length}</div>
        </div>
        <div class="cover-footer">কৃষিশিক্ষা - স্মার্ট প্রস্তুতির নির্ভরযোগ্য ঠিকানা</div>
      `;
      return cover;
    }

    function buildContentSection(selectedExam, questions) {
      const examTitle = window.EXAM_STATUS[selectedExam].title;

      const content = document.createElement("div");
      content.className = "content-section";

      const watermark = document.createElement("div");
      watermark.className = "content-watermark";
      watermark.textContent = "krisishikkha.com";
      content.appendChild(watermark);

      const title = document.createElement("div");
      title.className = "content-title";
      title.textContent = examTitle;
      content.appendChild(title);

      const sub = document.createElement("div");
      sub.className = "content-sub";
      sub.textContent = `মোট প্রশ্ন: ${questions.length}`;
      content.appendChild(sub);

      const grid = document.createElement("div");
      grid.className = "question-grid";

      const leftCol = document.createElement("div");
      leftCol.className = "col left-col";

      const divider = document.createElement("div");
      divider.className = "divider";

      const rightCol = document.createElement("div");
      rightCol.className = "col right-col";

      questions.forEach((q, index) => {
        const qbox = document.createElement("div");
        qbox.className = "qbox";

        const optionsHtml = (q.options || []).map((opt, idx) => {
          const correct = idx === q.answer ? "correct-option" : "";
          return `<div class="option ${correct}">${String.fromCharCode(65 + idx)}. ${escapeHtml(opt)}</div>`;
        }).join("");

        qbox.innerHTML = `
          <div class="qtitle">${index + 1}. ${escapeHtml(q.question)}</div>
          ${optionsHtml}
          <div class="explanation"><strong>ব্যাখ্যা:</strong> ${escapeHtml(q.explanation || "ব্যাখ্যা নেই")}</div>
        `;

        if (index % 2 === 0) {
          leftCol.appendChild(qbox);
        } else {
          rightCol.appendChild(qbox);
        }
      });

      grid.appendChild(leftCol);
      grid.appendChild(divider);
      grid.appendChild(rightCol);
      content.appendChild(grid);

      const footer = document.createElement("div");
      footer.className = "footer-note";
      footer.textContent = "krisishikkha.com";
      content.appendChild(footer);

      return content;
    }

    function buildPdfDocument(selectedExam, questions) {
      const root = document.createElement("div");
      root.className = "pdf-root";

      root.appendChild(buildCoverPage(selectedExam, questions));
      root.appendChild(buildContentSection(selectedExam, questions));

      return root;
    }

    downloadBtn.addEventListener("click", async () => {
      const selectedExam = examSelect.value;

      if (!selectedExam) {
        showStatus("দয়া করে একটি পরীক্ষা নির্বাচন করুন!", "error");
        return;
      }

      downloadBtn.disabled = true;
      downloadBtn.textContent = "Loading...";
      showStatus("প্রশ্ন লোড হচ্ছে...", "info");

      // Try multiple possible paths
      const possiblePaths = [
        `${BASE_PATH}/exam-corner/${selectedExam}/questions.js`,
        `/exam-corner/${selectedExam}/questions.js`,
        `./exam-corner/${selectedExam}/questions.js`,
      ];

      let loaded = false;

      for (const questionPath of possiblePaths) {
        try {
          console.log("📂 Trying path:", questionPath);
          await loadQuestionsJS(questionPath);
          const questions = getQuestionsArray();

          if (questions && questions.length > 0) {
            showStatus(`${questions.length}টি প্রশ্ন পাওয়া গেছে। PDF তৈরি হচ্ছে...`, "success");

            const pdfDoc = buildPdfDocument(selectedExam, questions);

            const opt = {
              margin: [8, 8, 8, 8],
              filename: `${window.EXAM_STATUS[selectedExam].title}-Answer-Sheet.pdf`,
              image: { type: "jpeg", quality: 0.98 },
              html2canvas: {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff",
                logging: false
              },
              jsPDF: {
                unit: "pt",
                format: "a4",
                orientation: "portrait"
              },
              pagebreak: {
                mode: ["css", "legacy"]
              }
            };

            await html2pdf().set(opt).from(pdfDoc).save();
            
            showStatus("✅ PDF সফলভাবে ডাউনলোড হয়েছে!", "success");
            loaded = true;
            break;
          }
        } catch (err) {
          console.log("❌ Path failed:", questionPath, err.message);
          continue;
        }
      }

      if (!loaded) {
        showStatus("❌ প্রশ্ন ফাইল পাওয়া যায়নি। ফোল্ডার স্ট্রাকচার চেক করুন।", "error");
      }

      downloadBtn.disabled = false;
      downloadBtn.textContent = "Download PDF";
    });

    // Initialize: Wait for EXAM_STATUS then populate dropdown
    waitForExamStatus(() => {
      populateExamDropdown();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin Download Center - Clean Question Boxes</title>
<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #f8f8f8;
}
h2 { margin-bottom: 20px; }
select {
  padding: 8px 12px;
  font-size: 16px;
  margin-right: 10px;
}
button {
  padding: 10px 20px;
  background: #2E8B57;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:hover {
  background: #246b45;
}
</style>
</head>
<body>

<h2>Admin Download Center - Question Box Style PDF</h2>

<select id="examSelect">
  <option value="">-- Select Exam --</option>
</select>

<button id="downloadBtn">Download PDF</button>

<script src="exam-status.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
// Load exams
const examSelect = document.getElementById("examSelect");
const downloadBtn = document.getElementById("downloadBtn");

for (const examId in EXAM_STATUS) {
  if (EXAM_STATUS[examId].visible) {
    const option = document.createElement("option");
    option.value = examId;
    option.textContent = EXAM_STATUS[examId].title;
    examSelect.appendChild(option);
  }
}

// Load questions dynamically
function loadQuestionsJS(path, callback){
  const script = document.createElement("script");
  script.src = path;
  script.onload = callback;
  document.body.appendChild(script);
}

// Download PDF
downloadBtn.addEventListener("click", ()=>{
  const selectedExam = examSelect.value;
  if (!selectedExam) {
    alert("Please select an exam first!");
    return;
  }

  loadQuestionsJS(`exam-corner/${selectedExam}/questions.js`, ()=>{

    const contentDiv = document.createElement("div");
    contentDiv.style.fontFamily = "Arial, sans-serif";
    contentDiv.style.lineHeight = "1.6";
    contentDiv.style.margin = "10px";

    // Cover page
    contentDiv.innerHTML = `
      <div style="text-align:center; page-break-after: always;">
        <h1>${EXAM_STATUS[selectedExam].title}</h1>
        <p style="font-size:16px;">Answer with Detailed Solution</p>
        <p style="font-size:14px;">তারিখ: ${new Date().toLocaleDateString("bn-BD")}</p>
        <hr style="margin:20px 0;">
      </div>
    `;

    // Questions with full block milky background
    QUESTIONS.forEach((q, i) => {
      const qHTML = `
        <div style="
          margin-top:15px; 
          page-break-inside: avoid; 
          border-radius:6px; 
          background-color:#fcfcfc; 
          padding:12px; 
          border:1px solid #ddd;
        ">
          <div style="font-weight:600; font-size:14px; margin-bottom:6px;">${i+1}. ${q.question}</div>
          ${q.options.map((opt,j)=>`
            <div style="margin-left:20px; font-size:13px; color:${j===q.answer?'green':'black'}; margin-bottom:3px;">
              ${String.fromCharCode(65+j)}. ${opt}
            </div>
          `).join('')}
          <div style="margin-top:6px; font-size:12px; padding:6px; border-left:4px solid #2E8B57;">
            ব্যাখ্যা: ${q.explanation}
          </div>
        </div>
      `;
      contentDiv.innerHTML += qHTML;
    });

    // PDF options with header/footer/page numbers
    const opt = {
      margin: [50,30,50,30],
      filename: `${EXAM_STATUS[selectedExam].title}.pdf`,
      html2canvas: { scale: 2, backgroundColor: null },
      jsPDF: { unit:'pt', format:'a4', orientation:'portrait' },
      pagebreak: { mode:['css','legacy'] },
      page: function(currentPage, totalPages){
        return `
          <div style="width:100%; text-align:center; font-size:10px; color:#555; position:absolute; top:20px;">
            ${EXAM_STATUS[selectedExam].title}
          </div>
          <div style="width:100%; text-align:center; font-size:10px; color:#555; position:absolute; bottom:20px;">
            ${new Date().toLocaleDateString("bn-BD")} | পৃষ্ঠা ${currentPage} / ${totalPages}
          </div>
        `;
      }
    };

    html2pdf().set(opt).from(contentDiv).save();

  });
});
</script>

</body>
</html>

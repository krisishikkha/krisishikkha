<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin Download Center</title>
<style>
body{
  font-family: "SolaimanLipi", "Noto Sans Bengali", sans-serif;
  padding:20px;
  background:#f8f8f8;
}
h2{ margin-bottom:20px; }
select{
  padding:8px 12px;
  font-size:16px;
  margin-right:10px;
}
button{
  padding:10px 20px;
  background:#2E8B57;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
button:hover{
  background:#246b45;
}
.question-block{
  margin-bottom:30px;
  page-break-inside: avoid;
}
.question{
  font-weight:600;
  margin-bottom:8px;
}
.option{
  margin-left:20px;
}
.correct{
  color:green;
  font-weight:600;
}
.explanation{
  margin-top:8px;
  font-size:14px;
  background:#f5f5f5;
  padding:8px;
  border-left:4px solid #2E8B57;
}
.cover{
  text-align:center;
  margin-top:150px;
  page-break-after: always;
}
</style>
</head>
<body>

<h2>Admin Download Center</h2>

<select id="examSelect">
  <option value="">-- Select Exam --</option>
</select>

<button id="downloadBtn">Download Solution PDF</button>

<div id="pdfContent" style="display:none;"></div>

<script src="exam-status.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.11.0/html2pdf.bundle.min.js"></script>

<script>
// Populate exam dropdown
const examSelect = document.getElementById("examSelect");
for(const examId in EXAM_STATUS){
  if(EXAM_STATUS[examId].visible){
    const option = document.createElement("option");
    option.value = examId;
    option.text = EXAM_STATUS[examId].title;
    examSelect.appendChild(option);
  }
}

// Load Questions JS dynamically
function loadQuestionsJS(path, callback){
  const script = document.createElement("script");
  script.src = path;
  script.onload = callback;
  document.body.appendChild(script);
}

// Generate PDF using html2pdf
function generatePDF(examTitle, questions){
  const container = document.getElementById("pdfContent");
  container.innerHTML = ""; // clear previous

  // Cover page
  container.innerHTML += `
    <div class="cover">
      <h1>${examTitle}</h1>
      <p>Answer with Detailed Solution</p>
      <p>তারিখ: ${new Date().toLocaleDateString("bn-BD")}</p>
    </div>
  `;

  // Questions
  questions.forEach((q,index)=>{
    const block = document.createElement("div");
    block.className = "question-block";

    let html = `<div class="question">${index+1}. ${q.question}</div>`;
    q.options.forEach((opt,i)=>{
      html += `<div class="option ${i===q.answer ? "correct":""}">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });
    html += `<div class="explanation"><strong>ব্যাখ্যা:</strong> ${q.explanation}</div>`;

    block.innerHTML = html;
    container.appendChild(block);
  });

  // PDF options
  const opt = {
    margin: [0.5,0.5,0.5,0.5],
    filename: `${examTitle}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, letterRendering: true },
    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(container).save();
}

// Button click → Load questions & generate PDF
document.getElementById("downloadBtn").addEventListener("click", ()=>{
  const selectedExam = examSelect.value;
  if(!selectedExam){
    alert("Please select an exam first!");
    return;
  }
  loadQuestionsJS(`exam-corner/${selectedExam}/questions.js`, ()=>{
    generatePDF(EXAM_STATUS[selectedExam].title, QUESTIONS);
  });
});
</script>

</body>
</html>

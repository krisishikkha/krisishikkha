<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin Download Center</title>
<style>
body { font-family: SolaimanLipi, Arial, sans-serif; padding:20px; color:#000; }
h2 { margin-bottom:20px; }

select {
  padding:8px 12px;
  font-size:16px;
  margin-right:10px;
}

button {
  padding:10px 20px;
  background:#2E8B57;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover {
  background:#246b45;
}
</style>
</head>
<body>

<h2>Admin Download Center</h2>

<select id="examSelect">
  <option value="">-- Select Exam --</option>
</select>

<button id="downloadBtn">Download Solution PDF</button>

<script src="exam-status.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const examSelect = document.getElementById('examSelect');
const downloadBtn = document.getElementById('downloadBtn');

/* ✅ Load only visible exams */
for(const examId in EXAM_STATUS){
  if(EXAM_STATUS[examId].visible){
    const option = document.createElement('option');
    option.value = examId;
    option.text = EXAM_STATUS[examId].title;
    examSelect.appendChild(option);
  }
}

/* ✅ Dynamic question loader */
function loadQuestionsJS(path, callback){
  let script = document.createElement('script');
  script.src = path;
  script.onload = callback;
  document.body.appendChild(script);
}

/* ✅ Optimized PDF Generator */
function generatePDF(examId, examTitle, questions){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','pt','a4');

  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 40;
  let y = 60;

  /* ===== COVER PAGE ===== */
  doc.setFontSize(26);
  doc.text(examTitle, pageWidth/2, 200, {align:'center'});

  doc.setFontSize(16);
  doc.text("Answer with Detailed Solution", pageWidth/2, 240, {align:'center'});

  doc.text(`Date: ${new Date().toLocaleDateString('bn-BD')}`, pageWidth/2, 270, {align:'center'});

  doc.addPage();
  y = 50;

  /* ===== QUESTIONS ===== */
  questions.forEach((q,i)=>{

    if(y > pageHeight - 80){
      doc.addPage();
      y = 50;
    }

    doc.setFontSize(15);
    doc.setTextColor(0,0,0);

    let questionLines = doc.splitTextToSize(`${i+1}. ${q.question}`, pageWidth - 2*margin);
    doc.text(questionLines, margin, y);
    y += questionLines.length * 18 + 10;

    q.options.forEach((opt,idx)=>{

      if(y > pageHeight - 60){
        doc.addPage();
        y = 50;
      }

      if(idx === q.answer){
        doc.setTextColor(34,139,34); // green
      } else {
        doc.setTextColor(0,0,0);
      }

      let optionLines = doc.splitTextToSize(`${String.fromCharCode(65+idx)}. ${opt}`, pageWidth - 2*margin - 20);
      doc.text(optionLines, margin + 20, y);
      y += optionLines.length * 16 + 5;

    });

    doc.setTextColor(0,0,0);
    doc.setFontSize(13);

    let explanationLines = doc.splitTextToSize(`ব্যাখ্যা: ${q.explanation}`, pageWidth - 2*margin);

    if(y + explanationLines.length*15 > pageHeight - 60){
      doc.addPage();
      y = 50;
    }

    doc.text(explanationLines, margin, y);
    y += explanationLines.length * 15 + 20;

  });

  doc.save(`${examTitle}.pdf`);
}

/* ✅ Button Click */
downloadBtn.addEventListener('click', ()=>{

  const selectedExam = examSelect.value;

  if(!selectedExam){
    alert("Please select an exam first!");
    return;
  }

  loadQuestionsJS(`exam-corner/${selectedExam}/questions.js`, ()=>{
    generatePDF(
      selectedExam,
      EXAM_STATUS[selectedExam].title,
      QUESTIONS
    );
  });

});

</script>

</body>
</html>

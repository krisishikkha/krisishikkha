<body>

<h2>Admin Download Center - Compact Two-Column PDF</h2>

<select id="examSelect">
  <option value="">-- Select Exam --</option>
</select>

<button id="downloadBtn">Download PDF</button>

<script src="exam-status.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const examSelect = document.getElementById("examSelect");
const downloadBtn = document.getElementById("downloadBtn");

// Load exams
for(const examId in EXAM_STATUS){
  if(EXAM_STATUS[examId].visible){
    const option = document.createElement("option");
    option.value = examId;
    option.textContent = EXAM_STATUS[examId].title;
    examSelect.appendChild(option);
  }
}

// Load questions dynamically
function loadQuestionsJS(path, callback){
  const script = document.createElement("script");
  script.src = path;
  script.onload = callback;
  document.body.appendChild(script);
}

// Download PDF
downloadBtn.addEventListener("click", ()=>{
  const selectedExam = examSelect.value;
  if(!selectedExam){
    alert("Please select an exam first!");
    return;
  }

  loadQuestionsJS(`exam-corner/${selectedExam}/questions.js`, ()=>{
    const contentDiv = document.createElement("div");

    // Cover Page
    contentDiv.innerHTML = `
      <div class="cover">
        <h1>${EXAM_STATUS[selectedExam].title}</h1>
        <p>Answer with Detailed Solution</p>
        <p>তারিখ: ${new Date().toLocaleDateString("bn-BD")}</p>
        <hr>
      </div>
    `;

    // Question Container
    const container = document.createElement("div");
    container.className = "pdf-container";

    QUESTIONS.forEach((q,i)=>{
      const box = document.createElement("div");
      box.className = "qbox";

      let optionsHTML = "";
      q.options.forEach((opt,j)=>{
        optionsHTML += `<div class="option ${j===q.answer?'answer':''}">${String.fromCharCode(65+j)}. ${opt}</div>`;
      });

      box.innerHTML = `
        <div class="qtitle">${i+1}. ${q.question}</div>
        ${optionsHTML}
        <div class="explanation">ব্যাখ্যা: ${q.explanation}</div>
      `;

      container.appendChild(box);
    });

    contentDiv.appendChild(container);

    // PDF Options
    const opt = {
      margin:[50,30,50,30], // top, left, bottom, right
      filename:`${EXAM_STATUS[selectedExam].title}.pdf`,
      html2canvas:{scale:2, backgroundColor:null},
      jsPDF:{unit:'pt', format:'a4', orientation:'portrait'},
      pagebreak:{mode:['css','legacy']}
    };

    html2pdf().set(opt).from(contentDiv).toPdf().get('pdf').then(function(pdf){
      const totalPages = pdf.internal.getNumberOfPages();
      for(let i=1; i<=totalPages; i++){
        pdf.setPage(i);
        pdf.setFontSize(10);
        // Header
        pdf.text(EXAM_STATUS[selectedExam].title, pdf.internal.pageSize.getWidth()/2, 20, {align:'center'});
        // Footer
        pdf.text(`${new Date().toLocaleDateString("bn-BD")} | পৃষ্ঠা ${i} / ${totalPages}`,
                 pdf.internal.pageSize.getWidth()/2,
                 pdf.internal.pageSize.getHeight()-20,
                 {align:'center'});
      }
    }).save();
  });
});
</script>

</body>

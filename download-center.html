<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin Download Center</title>

<!-- jsPDF CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family: SolaimanLipi, Arial, sans-serif;
  padding:20px;
  background:#f8f8f8;
}
h2{ margin-bottom:20px; }
select{
  padding:8px 12px;
  font-size:16px;
  margin-right:10px;
}
button{
  padding:10px 20px;
  background:#2E8B57;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
button:hover{
  background:#246b45;
}
</style>
</head>

<body>

<h2>Admin Download Center</h2>

<select id="examSelect">
  <option value="">-- Select Exam --</option>
</select>

<button id="downloadBtn">Download Solution PDF</button>

<script src="exam-status.js"></script>

<script>

const { jsPDF } = window.jspdf;

const examSelect = document.getElementById("examSelect");
const downloadBtn = document.getElementById("downloadBtn");

// Visible exam load
for(const examId in EXAM_STATUS){
  if(EXAM_STATUS[examId].visible){
    let option = document.createElement("option");
    option.value = examId;
    option.text = EXAM_STATUS[examId].title;
    examSelect.appendChild(option);
  }
}

// ✅ DIRECT PDF DOWNLOAD
downloadBtn.addEventListener("click", async ()=>{

  const selectedExam = examSelect.value;

  if(!selectedExam){
    alert("Please select an exam first!");
    return;
  }

  try{

    // solution page থেকে HTML content fetch
    const response = await fetch(`solution-booklet.html?exam=${selectedExam}`);
    const htmlText = await response.text();

    // Temporary container বানানো
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = htmlText;

    // শুধু body text নেওয়া
    const textContent = tempDiv.innerText;

    // PDF create
    const doc = new jsPDF();
    doc.setFont("helvetica");
    doc.setFontSize(12);

    const lines = doc.splitTextToSize(textContent, 180);
    doc.text(lines, 10, 10);

    doc.save(`${selectedExam}-solution.pdf`);

  }catch(err){
    alert("PDF Generate Failed!");
    console.error(err);
  }

});

</script>

</body>
</html>

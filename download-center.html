<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Admin Download Center</title>

<style>

body{
font-family: Arial, sans-serif;
padding:20px;
background:#f8f8f8;
}

h2{
margin-bottom:20px;
}

select{
padding:8px 12px;
font-size:16px;
margin-right:10px;
}

button{
padding:10px 20px;
background:#2E8B57;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#246b45;
}

/* PDF Content Layout */

.pdf-container{

width:794px;
margin:auto;

column-count:2;
column-gap:40px;

}

/* Question Box */

.qbox{

background:#fdfdf7;
border:1px solid #ddd;
border-radius:6px;

padding:12px;
margin-bottom:14px;

break-inside:avoid;

}

.qtitle{

font-weight:600;
font-size:14px;
margin-bottom:6px;

}

.option{

margin-left:18px;
font-size:13px;
margin-bottom:2px;

}

.answer{

color:green;
font-weight:600;

}

.explanation{

margin-top:6px;
font-size:12px;

}

.cover{

text-align:center;
page-break-after:always;

}

</style>
</head>

<body>

<h2>Admin Download Center - Question PDF</h2>

<select id="examSelect">
<option value="">-- Select Exam --</option>
</select>

<button id="downloadBtn">Download PDF</button>

<script src="exam-status.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

const examSelect=document.getElementById("examSelect")
const downloadBtn=document.getElementById("downloadBtn")

for(const examId in EXAM_STATUS){

if(EXAM_STATUS[examId].visible){

const option=document.createElement("option")

option.value=examId
option.textContent=EXAM_STATUS[examId].title

examSelect.appendChild(option)

}

}

function loadQuestionsJS(path,callback){

const script=document.createElement("script")

script.src=path

script.onload=callback

document.body.appendChild(script)

}

downloadBtn.addEventListener("click",()=>{

const selectedExam=examSelect.value

if(!selectedExam){

alert("Please select an exam first!")

return

}

loadQuestionsJS(`exam-corner/${selectedExam}/questions.js`,()=>{

const contentDiv=document.createElement("div")

/* Cover Page */

contentDiv.innerHTML=`

<div class="cover">

<h1>${EXAM_STATUS[selectedExam].title}</h1>

<p>Answer with Detailed Solution</p>

<p>তারিখ: ${new Date().toLocaleDateString("bn-BD")}</p>

<hr>

</div>

`

/* Question Container */

const container=document.createElement("div")

container.className="pdf-container"

/* Questions */

QUESTIONS.forEach((q,i)=>{

const box=document.createElement("div")

box.className="qbox"

let optionsHTML=""

q.options.forEach((opt,j)=>{

optionsHTML+=`

<div class="option ${j===q.answer?'answer':''}">

${String.fromCharCode(65+j)}. ${opt}

</div>

`

})

box.innerHTML=`

<div class="qtitle">

${i+1}. ${q.question}

</div>

${optionsHTML}

<div class="explanation">

ব্যাখ্যা: ${q.explanation}

</div>

`

container.appendChild(box)

})

contentDiv.appendChild(container)

/* PDF Options */

const opt={

margin:[60,40,60,40],

filename:`${EXAM_STATUS[selectedExam].title}.pdf`,

html2canvas:{scale:2},

jsPDF:{unit:'pt',format:'a4',orientation:'portrait'},

pagebreak:{mode:['css','legacy']}

}

html2pdf().set(opt).from(contentDiv).toPdf().get('pdf').then(function(pdf){

const totalPages=pdf.internal.getNumberOfPages()

for(let i=1;i<=totalPages;i++){

pdf.setPage(i)

pdf.setFontSize(10)

pdf.text(

EXAM_STATUS[selectedExam].title,

pdf.internal.pageSize.getWidth()/2,

20,

{align:'center'}

)

pdf.text(

`${new Date().toLocaleDateString("bn-BD")} | পৃষ্ঠা ${i} / ${totalPages}`,

pdf.internal.pageSize.getWidth()/2,

pdf.internal.pageSize.getHeight()-20,

{align:'center'}

)

}

}).save()

})

})

</script>

</body>
</html>

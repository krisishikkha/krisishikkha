<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Maker - Create Beautiful Notes</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- ============= LEFT PANEL: INPUT ============= -->
        <div class="input-panel">
            <div class="panel-header">
                <h1>📝 Note Maker</h1>
                <p>Create Beautiful Notes in Minutes</p>
            </div>

            <form id="noteForm">
                <!-- 1. PROMOTIONAL TAG -->
                <div class="form-group">
                    <label for="promoTag">Promotional Tag (Optional)</label>
                    <input 
                        type="text" 
                        id="promoTag" 
                        placeholder="e.g., Exam Special, Important Note"
                        maxlength="30"
                    >
                </div>

                <!-- 2. TITLE -->
                <div class="form-group">
                    <label for="title">
                        Title <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="title" 
                        placeholder="Enter main title"
                        required
                        maxlength="80"
                    >
                </div>

                <!-- 3. SUBTITLE -->
                <div class="form-group">
                    <label for="subtitle">Subtitle (Optional)</label>
                    <input 
                        type="text" 
                        id="subtitle" 
                        placeholder="Enter subtitle"
                        maxlength="100"
                    >
                </div>

                <!-- 4. MAIN CONTENT -->
                <div class="form-group">
                    <label for="content">
                        Main Content <span class="required">*</span>
                    </label>
                    <textarea 
                        id="content" 
                        placeholder="Enter your content here...
- Use - or • for bullet points
* Use * for bullets too
1. Use numbers for lists

Write paragraphs normally."
                        rows="10"
                        required
                    ></textarea>
                    <small class="hint">💡 Use -, •, * for bullets and 1. for numbers</small>
                </div>

                <!-- 5. FOOTER -->
                <div class="form-group">
                    <label for="footer">Footer/Advertisement (Optional)</label>
                    <input 
                        type="text" 
                        id="footer" 
                        placeholder="e.g., Visit: example.com"
                        maxlength="60"
                    >
                </div>

                <!-- DIVIDER -->
                <div class="form-divider"></div>

                <!-- CUSTOMIZATION SECTION -->
                <h3 class="section-title">🎨 Customization</h3>

                <!-- Font Controls -->
                <div class="font-controls">
                    <div class="form-group">
                        <label for="promoFont">Promo Tag Font</label>
                        <select id="promoFont">
                            <option value="Arial">Arial</option>
                            <option value="'Noto Sans'">Noto Sans</option>
                            <option value="Roboto">Roboto</option>
                            <option value="'Courier New'">Courier New</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="titleFont">Title Font</label>
                        <select id="titleFont">
                            <option value="Arial">Arial</option>
                            <option value="'Noto Sans'">Noto Sans</option>
                            <option value="Roboto">Roboto</option>
                            <option value="Georgia">Georgia</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contentFont">Content Font</label>
                        <select id="contentFont">
                            <option value="Arial">Arial</option>
                            <option value="'Noto Sans'">Noto Sans</option>
                            <option value="Roboto">Roboto</option>
                            <option value="'Courier New'">Courier New</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="footerFont">Footer Font</label>
                        <select id="footerFont">
                            <option value="Arial">Arial</option>
                            <option value="'Noto Sans'">Noto Sans</option>
                            <option value="Roboto">Roboto</option>
                        </select>
                    </div>
                </div>

                <!-- Layout Options -->
                <div class="form-group">
                    <label for="template">Template Style</label>
                    <select id="template">
                        <option value="minimal">Minimal</option>
                        <option value="boxed">Boxed</option>
                        <option value="highlight">Highlight</option>
                    </select>
                </div>

                <!-- Text Alignment -->
                <div class="form-group">
                    <label>Text Alignment</label>
                    <div class="alignment-buttons">
                        <button type="button" class="align-btn" data-align="left" title="Left">
                            ⬅️ Left
                        </button>
                        <button type="button" class="align-btn" data-align="center" title="Center">
                            ⬆️ Center
                        </button>
                        <button type="button" class="align-btn" data-align="justify" title="Justify">
                            ⬇️ Justify
                        </button>
                    </div>
                </div>

                <!-- Line Spacing -->
                <div class="form-group">
                    <label for="lineSpacing">Line Spacing</label>
                    <input 
                        type="range" 
                        id="lineSpacing" 
                        min="1" 
                        max="2.5" 
                        step="0.1" 
                        value="1.6"
                    >
                    <span id="spacingValue">1.6</span>
                </div>

                <!-- Logo Toggle -->
                <div class="form-group checkbox">
                    <input 
                        type="checkbox" 
                        id="showLogo" 
                        checked
                    >
                    <label for="showLogo">Show Logo/Watermark</label>
                </div>

                <!-- Action Buttons -->
                <div class="form-actions">
                    <button type="button" id="previewBtn" class="btn btn-primary">
                        👁️ Update Preview
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        🔄 Clear Form
                    </button>
                </div>
            </form>
        </div>

        <!-- ============= RIGHT PANEL: PREVIEW & EXPORT ============= -->
        <div class="preview-panel">
            <div class="preview-controls">
                <h2>Preview</h2>
                <div class="export-buttons">
                    <button id="downloadPNG" class="btn btn-export btn-png">
                        📥 PNG
                    </button>
                    <button id="downloadJPG" class="btn btn-export btn-jpg">
                        📥 JPG
                    </button>
                    <button id="downloadPDF" class="btn btn-export btn-pdf">
                        📥 PDF
                    </button>
                </div>
            </div>

            <!-- PREVIEW CONTAINER -->
            <div id="previewContainer" class="preview-container">
                <div id="preview" class="preview-content minimal">
                    <p class="placeholder">👈 Fill the form and click "Update Preview"</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/parser.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
  </html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নোট মেকার - সুন্দর নোট তৈরি করুন</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- ============= বাম প্যানেল: ইনপুট ============= -->
        <div class="input-panel">
            <div class="panel-header">
                <h1>📝 নোট মেকার</h1>
                <p>সুন্দর নোট তৈরি করুন সহজেই</p>
            </div>

            <form id="noteForm">
                <!-- ১. প্রোমোশনাল ট্যাগ -->
                <div class="form-group">
                    <label for="promoTag">প্রোমোশনাল ট্যাগ (ঐচ্ছিক)</label>
                    <input 
                        type="text" 
                        id="promoTag" 
                        placeholder="যেমন: পরীক্ষা বিশেষ, গুরুত্বপূর্ণ"
                        maxlength="30"
                    >
                </div>

                <!-- ২. শিরোনাম -->
                <div class="form-group">
                    <label for="title">
                        শিরোনাম <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="title" 
                        placeholder="আপনার শিরোনাম লিখুন"
                        required
                        maxlength="100"
                    >
                </div>

                <!-- ৩. উপশিরোনাম -->
                <div class="form-group">
                    <label for="subtitle">উপ���িরোনাম (ঐচ্ছিক)</label>
                    <input 
                        type="text" 
                        id="subtitle" 
                        placeholder="উপশিরোনাম লিখুন"
                        maxlength="100"
                    >
                </div>

                <!-- ৪. মূল বিষয়বস্তু -->
                <div class="form-group">
                    <label for="content">
                        মূল বিষয়বস্তু <span class="required">*</span>
                    </label>
                    <textarea 
                        id="content" 
                        placeholder="আপনার বিষয়বস্তু লিখুন...

- বুলেট পয়েন্টের জন্য হাইফেন ব্যবহার করুন
• অথবা এই চিহ্ন ব্যবহার করুন
* অথবা তারকা চিহ্ন
1. সংখ্যার তালিকার জন্য সংখ্যা ব্যবহার করুন

সাধারণ অনুচ্ছেদ এভাবে লিখুন।"
                        rows="12"
                        required
                    ></textarea>
                    <small class="hint">💡 - অথবা • অথবা * বুলেটের জন্য। 1. সংখ্যার তালিকার জন্য।</small>
                    <small class="hint">💡 বোল্ড করতে: **শব্দ** (দুই পাশে তারকা দিন)</small>
                </div>

                <!-- ৫. ফুটার -->
                <div class="form-group">
                    <label for="footer">বিজ্ঞাপন/ফুটার (ঐচ্ছিক)</label>
                    <input 
                        type="text" 
                        id="footer" 
                        placeholder="যেমন: ওয়েবসাইট: example.com"
                        maxlength="60"
                    >
                </div>

                <!-- ============= কাস্টমাইজেশন ============= -->
                <div class="form-divider"></div>
                <h3 class="section-title">🎨 ফন্ট সাইজ কাস্টমাইজ করুন</h3>

                <!-- প্রোমো ট্যাগ ফন্ট সাইজ -->
                <div class="font-size-group">
                    <label for="promoFontSize">প্রোমো ট্যাগ সাইজ</label>
                    <div class="slider-container">
                        <input 
                            type="range" 
                            id="promoFontSize" 
                            min="8" 
                            max="20" 
                            value="11"
                            class="font-slider"
                        >
                        <span class="font-size-value" id="promoSizeValue">11px</span>
                    </div>
                </div>

                <!-- টাইটেল ফন্ট সাইজ -->
                <div class="font-size-group">
                    <label for="titleFontSize">শিরোনাম সাইজ</label>
                    <div class="slider-container">
                        <input 
                            type="range" 
                            id="titleFontSize" 
                            min="20" 
                            max="48" 
                            value="28"
                            class="font-slider"
                        >
                        <span class="font-size-value" id="titleSizeValue">28px</span>
                    </div>
                </div>

                <!-- সাবটাইটেল ফন্ট সাইজ -->
                <div class="font-size-group">
                    <label for="subtitleFontSize">উপশিরোনাম সাইজ</label>
                    <div class="slider-container">
                        <input 
                            type="range" 
                            id="subtitleFontSize" 
                            min="12" 
                            max="28" 
                            value="14"
                            class="font-slider"
                        >
                        <span class="font-size-value" id="subtitleSizeValue">14px</span>
                    </div>
                </div>

                <!-- কন্টেন্ট ফন্ট সাইজ -->
                <div class="font-size-group">
                    <label for="contentFontSize">বিষয়বস্তু সাইজ</label>
                    <div class="slider-container">
                        <input 
                            type="range" 
                            id="contentFontSize" 
                            min="12" 
                            max="20" 
                            value="13"
                            class="font-slider"
                        >
                        <span class="font-size-value" id="contentSizeValue">13px</span>
                    </div>
                </div>

                <!-- ফুটার ফন্ট সাইজ -->
                <div class="font-size-group">
                    <label for="footerFontSize">ফুটার সাইজ</label>
                    <div class="slider-container">
                        <input 
                            type="range" 
                            id="footerFontSize" 
                            min="8" 
                            max="16" 
                            value="10"
                            class="font-slider"
                        >
                        <span class="font-size-value" id="footerSizeValue">10px</span>
                    </div>
                </div>

                <!-- লাইন স্পেসিং -->
                <div class="font-size-group">
                    <label for="lineHeight">লাইন ফাঁক (কমিয়ে দিন)</label>
                    <div class="slider-container">
                        <input 
                            type="range" 
                            id="lineHeight" 
                            min="0.8" 
                            max="1.8" 
                            step="0.1"
                            value="1.1"
                            class="font-slider"
                        >
                        <span class="font-size-value" id="lineHeightValue">1.1</span>
                    </div>
                </div>

                <!-- অ্যাকশন বাটন -->
                <div class="form-actions">
                    <button type="button" id="previewBtn" class="btn btn-primary">
                        👁️ প্রিভিউ দেখান
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        🔄 পরিষ্কার করুন
                    </button>
                </div>
            </form>
        </div>

        <!-- ============= ডান প্যানেল: প্রিভিউ ============= -->
        <div class="preview-panel">
            <div class="preview-controls">
                <h2>📄 প্রিভিউ (A4 সাইজ)</h2>
                <div class="export-buttons">
                    <button id="downloadPNG" class="btn btn-export btn-png">
                        📥 PNG ডাউনলোড
                    </button>
                    <button id="downloadJPG" class="btn btn-export btn-jpg">
                        📥 JPG ডাউনলোড
                    </button>
                </div>
            </div>

            <!-- প্রিভিউ কন্টেইনার -->
            <div class="preview-container">
                <div id="preview" class="preview-content">
                    <p class="placeholder">👈 ফর্ম পূরণ করুন এবং "প্রিভিউ দেখান" ক্লিক করুন</p>
                </div>
            </div>
        </div>
    </div>

    <!-- স্ক্রিপ্ট -->
    <script src="js/parser.js"></script>
    <script src="js/export.js"></script>
    <script src="js/app.js"></script>
</body>
    </html>

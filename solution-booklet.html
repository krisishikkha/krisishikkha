<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Solution Booklet</title>

<!-- SolaimanLipi ফন্ট লোড -->
<style>
@font-face {
    font-family: 'SolaimanLipi';
    src: url('assets/fonts/SolaimanLipi_20-04-07.ttf') format('truetype');
}

body {
    font-family: 'SolaimanLipi', Arial, sans-serif;
    margin: 20px;
}

h1, h2, h3 {
    font-family: 'SolaimanLipi', Arial, sans-serif;
}

.question-block {
    margin-bottom: 20px;
    page-break-inside: avoid;
}

.option {
    margin-left: 20px;
}

.correct {
    color: green;
    font-weight: 600;
}

.explanation {
    margin-top: 5px;
    padding: 5px;
    background: #f5f5f5;
    border-left: 4px solid #2E8B57;
    font-size: 14px;
}

#downloadBtn {
    padding: 10px 16px;
    background: #2E8B57;
    color: white;
    border: none;
    cursor: pointer;
    margin-bottom: 20px;
}
</style>
</head>
<body>

<button id="downloadBtn">Download PDF</button>
<div id="content"></div>

<script src="exam-status.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// URL থেকে exam ID পড়া
const params = new URLSearchParams(window.location.search);
const examId = params.get("exam");

if(!examId || !EXAM_STATUS[examId] || !EXAM_STATUS[examId].visible){
    alert("Exam hidden or invalid!");
}

// Dynamic questions load
function loadQuestionsJS(path, callback){
    const script = document.createElement("script");
    script.src = path;
    script.onload = callback;
    document.body.appendChild(script);
}

// PDF তৈরি করার ফাংশন
async function generatePDF(examTitle, questions){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'pt', 'a4');
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 40;
    let y = 50;

    // SolaimanLipi ফন্ট embed
    const fontUrl = 'assets/fonts/SolaimanLipi_20-04-07.ttf';
    const fontResp = await fetch(fontUrl);
    const fontBuffer = await fontResp.arrayBuffer();
    const fontBase64 = btoa(new Uint8Array(fontBuffer).reduce((data, byte) => data + String.fromCharCode(byte), ""));
    doc.addFileToVFS("SolaimanLipi.ttf", fontBase64);
    doc.addFont("SolaimanLipi.ttf", "SolaimanLipi", "normal");
    doc.setFont("SolaimanLipi");

    // Cover page
    doc.setFontSize(28);
    doc.text(examTitle, pageWidth/2, 200, {align:'center'});
    doc.setFontSize(16);
    doc.text("Answer with Detailed Solution", pageWidth/2, 240, {align:'center'});
    doc.text(`তারিখ: ${new Date().toLocaleDateString("bn-BD")}`, pageWidth/2, 270, {align:'center'});
    doc.addPage();
    y = 50;

    // Questions
    questions.forEach((q, i) => {
        if(y > pageHeight - 80){ doc.addPage(); y=50; }

        // Question
        doc.setFontSize(14);
        let qLines = doc.splitTextToSize(`${i+1}. ${q.question}`, pageWidth - 2*margin);
        doc.text(qLines, margin, y);
        y += qLines.length * 18 + 8;

        // Options
        q.options.forEach((opt, idx) => {
            if(y > pageHeight - 60){ doc.addPage(); y=50; }
            doc.setFontSize(13);
            if(idx === q.answer){
                doc.setTextColor(34,139,34);
            } else {
                doc.setTextColor(0,0,0);
            }
            let optLines = doc.splitTextToSize(`${String.fromCharCode(65+idx)}. ${opt}`, pageWidth - 2*margin - 20);
            doc.text(optLines, margin+20, y);
            y += optLines.length * 16 + 5;
        });

        // Explanation
        doc.setTextColor(0,0,0);
        doc.setFontSize(12);
        let expLines = doc.splitTextToSize(`ব্যাখ্যা: ${q.explanation}`, pageWidth - 2*margin);
        if(y + expLines.length*15 > pageHeight - 60){ doc.addPage(); y=50; }
        doc.text(expLines, margin, y);
        y += expLines.length*15 + 15;
    });

    doc.save(`${examTitle}.pdf`);
}

// Load questions and attach PDF
loadQuestionsJS(`exam-corner/${examId}/questions.js`, ()=>{
    const container = document.getElementById("content");

    container.innerHTML += `<h1>${EXAM_STATUS[examId].title}</h1>`;

    QUESTIONS.forEach((q, i)=>{
        let block = document.createElement("div");
        block.className = "question-block";

        let html = `<div class="question">${i+1}. ${q.question}</div>`;
        q.options.forEach((opt, idx)=>{
            html += `<div class="option ${idx===q.answer ? "correct":""}">${String.fromCharCode(65+idx)}. ${opt}</div>`;
        });
        html += `<div class="explanation">ব্যাখ্যা: ${q.explanation}</div>`;
        block.innerHTML = html;
        container.appendChild(block);
    });

    document.getElementById("downloadBtn").addEventListener("click", ()=>{
        generatePDF(EXAM_STATUS[examId].title, QUESTIONS);
    });
});
</script>

</body>
</html>

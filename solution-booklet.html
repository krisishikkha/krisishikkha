<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Solution Booklet</title>
<style>
body{
  font-family: "Nirmala UI", Arial, sans-serif;
  margin:40px;
  line-height:1.7;
}
h1{text-align:center;}
.cover{text-align:center;margin-top:150px;page-break-after: always;}
.question-block{margin-bottom:30px;page-break-inside: avoid;}
.question{font-weight:600;margin-bottom:8px;}
.option{margin-left:20px;}
.correct{color:green;font-weight:600;}
.explanation{margin-top:8px;font-size:14px;background:#f5f5f5;padding:8px;border-left:4px solid #2E8B57;}
.print-btn{
  margin-bottom:20px;
  padding:8px 16px;
  background:#2E8B57;
  color:white;
  border:none;
  cursor:pointer;
}
</style>
</head>
<body>

<button class="print-btn" id="downloadBtn">Download PDF</button>
<div id="content"></div>

<script src="exam-status.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const examId = params.get("exam");

if(!examId || !EXAM_STATUS[examId] || !EXAM_STATUS[examId].visible){
  alert("Exam hidden or invalid!");
}

// Load questions dynamically
function loadQuestionsJS(path, callback){
  const script = document.createElement("script");
  script.src = path;
  script.onload = callback;
  document.body.appendChild(script);
}

loadQuestionsJS(`exam-corner/${examId}/questions.js`, ()=>{

  const container = document.getElementById("content");

  // Cover page
  container.innerHTML += `
    <div class="cover">
      <h1>${EXAM_STATUS[examId].title}</h1>
      <p>Answer with Detailed Solution</p>
      <p>তারিখ: ${new Date().toLocaleDateString("bn-BD")}</p>
    </div>
  `;

  // Questions
  QUESTIONS.forEach((q,index)=>{
    const block = document.createElement("div");
    block.className = "question-block";
    let html = `<div class="question">${index+1}. ${q.question}</div>`;
    q.options.forEach((opt,i)=>{
      html += `<div class="option ${i===q.answer ? "correct":""}">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });
    html += `<div class="explanation"><strong>ব্যাখ্যা:</strong> ${q.explanation}</div>`;
    block.innerHTML = html;
    container.appendChild(block);
  });

  // Download PDF button logic
  const downloadBtn = document.getElementById("downloadBtn");
  downloadBtn.addEventListener("click", async ()=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','pt','a4');
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 40;
    let y = 50;

    // Cover page
    doc.setFont("helvetica");
    doc.setFontSize(28);
    doc.text(EXAM_STATUS[examId].title, pageWidth/2, 200, {align:'center'});
    doc.setFontSize(16);
    doc.text("Answer with Detailed Solution", pageWidth/2, 240, {align:'center'});
    doc.text(`তারিখ: ${new Date().toLocaleDateString("bn-BD")}`, pageWidth/2, 270, {align:'center'});
    doc.addPage();
    y = 50;

    // Questions
    QUESTIONS.forEach((q,i)=>{
      if(y > pageHeight - 80){ doc.addPage(); y=50; }

      // Question
      doc.setFontSize(14);
      let qLines = doc.splitTextToSize(`${i+1}. ${q.question}`, pageWidth - 2*margin);
      doc.text(qLines, margin, y);
      y += qLines.length*18 + 8;

      // Options
      q.options.forEach((opt, idx)=>{
        if(y > pageHeight - 60){ doc.addPage(); y=50; }
        doc.setFontSize(13);
        doc.setTextColor(idx===q.answer ? 34 : 0, idx===q.answer ? 139 : 0, idx===q.answer ? 34 : 0);
        let optLines = doc.splitTextToSize(`${String.fromCharCode(65+idx)}. ${opt}`, pageWidth - 2*margin - 20);
        doc.text(optLines, margin+20, y);
        y += optLines.length*16 + 5;
      });

      // Explanation
      doc.setFontSize(12);
      doc.setTextColor(0,0,0);
      let expLines = doc.splitTextToSize(`ব্যাখ্যা: ${q.explanation}`, pageWidth - 2*margin);
      if(y + expLines.length*15 > pageHeight - 60){ doc.addPage(); y=50; }
      doc.text(expLines, margin, y);
      y += expLines.length*15 + 15;
    });

    // Save PDF with exam title
    doc.save(`${EXAM_STATUS[examId].title}.pdf`);
  });

});
</script>
</body>
</html>

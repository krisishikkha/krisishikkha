<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Solution Booklet</title>
<style>
body{
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  margin:20px;
  line-height:1.6;
}
h1{text-align:center;margin-bottom:20px;}
#downloadBtn{
  padding:8px 16px;
  background:#2E8B57;
  color:white;
  border:none;
  cursor:pointer;
  margin-bottom:20px;
}
</style>
</head>
<body>

<button id="downloadBtn">Download PDF</button>
<div id="content" style="display:none;"></div>

<script src="exam-status.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const examId = params.get("exam");

if(!examId || !EXAM_STATUS[examId] || !EXAM_STATUS[examId].visible){
  alert("Exam hidden or invalid!");
}

// Load questions dynamically
function loadQuestionsJS(path, callback){
  let script = document.createElement("script");
  script.src = path;
  script.onload = callback;
  document.body.appendChild(script);
}

loadQuestionsJS(`exam-corner/${examId}/questions.js`, ()=>{

  const { jsPDF } = window.jspdf;

  document.getElementById("downloadBtn").addEventListener("click", ()=>{

    const doc = new jsPDF('p','pt','a4');
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 40;
    let y = 50;

    // Cover page
    doc.setFont("helvetica", "normal");
    doc.setFontSize(22);
    doc.text(EXAM_STATUS[examId].title, pageWidth/2, y, {align:'center'});
    y += 30;
    doc.setFontSize(14);
    doc.text("Answer with Detailed Solution", pageWidth/2, y, {align:'center'});
    y += 20;
    doc.text(`তারিখ: ${new Date().toLocaleDateString("bn-BD")}`, pageWidth/2, y, {align:'center'});
    doc.addPage();
    y = 50;

    let pageNumber = 1;

    QUESTIONS.forEach((q,index)=>{
      // Question
      doc.setFontSize(14);
      let qLines = doc.splitTextToSize(`${index+1}. ${q.question}`, pageWidth - 2*margin);
      if(y + qLines.length*18 > pageHeight - 60){ 
        doc.addPage(); y = 50; pageNumber++; 
      }
      doc.text(qLines, margin, y);
      y += qLines.length*18 + 5;

      // Options
      q.options.forEach((opt,i)=>{
        doc.setFontSize(13);
        if(i===q.answer){ doc.setTextColor(34,139,34); } else { doc.setTextColor(0,0,0); }
        let optLines = doc.splitTextToSize(`${String.fromCharCode(65+i)}. ${opt}`, pageWidth - 2*margin - 20);
        if(y + optLines.length*16 > pageHeight - 60){ 
          doc.addPage(); y = 50; pageNumber++; 
        }
        doc.text(optLines, margin+20, y);
        y += optLines.length*16 + 3;
      });

      // Explanation
      doc.setTextColor(0,0,0);
      doc.setFontSize(12);
      let expLines = doc.splitTextToSize(`ব্যাখ্যা: ${q.explanation}`, pageWidth - 2*margin);
      if(y + expLines.length*15 > pageHeight - 60){ 
        doc.addPage(); y = 50; pageNumber++; 
      }
      doc.text(expLines, margin, y);
      y += expLines.length*15 + 10;

      // Page number
      doc.setFontSize(10);
      doc.setTextColor(150,150,150);
      doc.text(`Page ${pageNumber}`, pageWidth/2, pageHeight - 30, {align:'center'});
      doc.setTextColor(0,0,0);
    });

    doc.save(`${EXAM_STATUS[examId].title}.pdf`);
  });

});
</script>

</body>
</html>

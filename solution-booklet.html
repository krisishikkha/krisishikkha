<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Solution Booklet</title>
<style>
body { font-family: SolaimanLipi, Arial, sans-serif; padding:20px; color:#000; }
#downloadBtn { padding:10px 20px; background:#2E8B57; color:white; border:none; border-radius:5px; cursor:pointer; margin-bottom:20px; }
#downloadBtn:hover{ background:#246b45; }
</style>
</head>
<body>

<button id="downloadBtn">Download PDF</button>
<div id="content"></div>

<script src="exam-status.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const examId = params.get('exam');

if(!examId || !EXAM_STATUS[examId] || !EXAM_STATUS[examId].visible){
    alert("Exam hidden or invalid!");
    document.getElementById('downloadBtn').style.display='none';
}

// Load questions JS dynamically
function loadQuestionsJS(path, callback){
    let script = document.createElement('script');
    script.src = path;
    script.onload = callback;
    document.body.appendChild(script);
}

// Load questions
loadQuestionsJS(`exam-corner/${examId}/questions.js`, ()=>{
    const examTitle = EXAM_STATUS[examId].title;

    document.getElementById('downloadBtn').addEventListener('click', ()=>{
        generatePDF(examTitle, QUESTIONS);
    });
});

// Generate PDF with embedded SolaimanLipi
async function generatePDF(examTitle, questions){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','pt','a4');

    // Load font
    const response = await fetch("assets/fonts/SolaimanLipi_20-04-07.ttf");
    const fontBuffer = await response.arrayBuffer();
    const fontBase64 = btoa(String.fromCharCode(...new Uint8Array(fontBuffer)));
    doc.addFileToVFS("SolaimanLipi.ttf", fontBase64);
    doc.addFont("SolaimanLipi.ttf", "SolaimanLipi", "normal");
    doc.setFont("SolaimanLipi");

    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 40;
    let y = 80;

    // Cover Page
    doc.setFontSize(28);
    doc.text(examTitle, pageWidth/2, 200, {align:'center'});
    doc.setFontSize(16);
    doc.text("Answer with Detailed Solution", pageWidth/2, 240, {align:'center'});
    doc.text(`তারিখ: ${new Date().toLocaleDateString('bn-BD')}`, pageWidth/2, 270, {align:'center'});
    doc.addPage();
    y = 50;

    // Questions
    questions.forEach((q,i)=>{
        if(y>750){ doc.addPage(); y=50; }

        doc.setFontSize(16);
        let qLines = doc.splitTextToSize(`${i+1}. ${q.question}`, pageWidth-2*margin);
        doc.text(qLines, margin, y);
        y += qLines.length*18 + 8;

        q.options.forEach((opt,idx)=>{
            if(y>750){ doc.addPage(); y=50; }
            doc.setFontSize(14);
            doc.setTextColor(idx===q.answer?34:0, idx===q.answer?139:0, idx===q.answer?34:0);
            let optLines = doc.splitTextToSize(`${String.fromCharCode(65+idx)}. ${opt}`, pageWidth-2*margin-20);
            doc.text(optLines, margin+20, y);
            y += optLines.length*16 + 5;
        });

        doc.setTextColor(0,0,0);
        let expLines = doc.splitTextToSize(`ব্যাখ্যা: ${q.explanation}`, pageWidth-2*margin);
        if(y + expLines.length*15 > pageHeight-60){ doc.addPage(); y=50; }
        doc.text(expLines, margin, y);
        y += expLines.length*15 + 20;
    });

    doc.save(`${examTitle}.pdf`);
}
</script>

</body>
</html>

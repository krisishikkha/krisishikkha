<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Solution Booklet</title>
<style>
body { font-family: SolaimanLipi, Arial, sans-serif; padding:20px; color:#000; }
#downloadBtn { padding:10px 20px; background:#2E8B57; color:white; border:none; border-radius:5px; cursor:pointer; margin-bottom:20px; }
#downloadBtn:hover{ background:#246b45; }
</style>
</head>
<body>

<button id="downloadBtn">Download PDF</button>
<div id="content"></div>

<script src="exam-status.js"></script>

<script>
// Read examId from URL
const params = new URLSearchParams(window.location.search);
const examId = params.get('exam');

if(!examId || !EXAM_STATUS[examId] || !EXAM_STATUS[examId].visible){
    alert("Exam hidden or invalid!");
    document.getElementById('downloadBtn').style.display='none';
}

// Load questions JS dynamically
function loadQuestionsJS(path, callback){
    let script = document.createElement('script');
    script.src = path;
    script.onload = callback;
    document.body.appendChild(script);
}

// Load questions
loadQuestionsJS(`exam-corner/${examId}/questions.js`, ()=>{
    const examTitle = EXAM_STATUS[examId].title;

    document.getElementById('downloadBtn').addEventListener('click', ()=>{
        generatePDF(examTitle, QUESTIONS);
    });
});

// Generate PDF function (text-based, optimized)
function generatePDF(examTitle, questions){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','pt','a4');
    const pageWidth = doc.internal.pageSize.getWidth();
    const margin = 40;
    let y = 50;

    // Add cover page
    doc.setFontSize(28);
    doc.text(examTitle, pageWidth/2, 150, {align:'center'});
    doc.setFontSize(16);
    doc.text("Answer with Detailed Solution", pageWidth/2, 200, {align:'center'});
    doc.text(`Date: ${new Date().toLocaleDateString('bn-BD')}`, pageWidth/2, 230, {align:'center'});
    doc.addPage();
    y = 50;

    doc.setFontSize(14);

    // Loop questions
    questions.forEach((q,i)=>{
        if(y > 700){ doc.addPage(); y=50; } // page break

        doc.setFontSize(16);
        doc.text(`${i+1}. ${q.question}`, margin, y);
        y += 25;

        q.options.forEach((opt,idx)=>{
            doc.setFontSize(14);
            if(idx === q.answer){
                doc.setTextColor(34,139,34); // green for correct
            } else {
                doc.setTextColor(0,0,0);
            }
            doc.text(`${String.fromCharCode(65+idx)}. ${opt}`, margin+20, y);
            y += 20;
            if(y>750){ doc.addPage(); y=50; }
        });

        // Explanation
        doc.setTextColor(0,0,0);
        doc.setFontSize(12);
        let explanationLines = doc.splitTextToSize(`ব্যাখ্যা: ${q.explanation}`, pageWidth - 2*margin);
        doc.text(explanationLines, margin, y);
        y += explanationLines.length*15 + 15;

        if(y>750){ doc.addPage(); y=50; }
    });

    doc.save(`${EXAM_STATUS[examId].title}.pdf`);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>

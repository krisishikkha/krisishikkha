<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Solution Booklet</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:40px;
  line-height:1.7;
}

.cover{
  text-align:center;
  margin-bottom:40px;
}

.question-block{
  margin-bottom:20px;
}

.question{
  font-weight:600;
  margin-bottom:6px;
}

.option{
  margin-left:20px;
}

.correct{
  color:green;
  font-weight:600;
}

.explanation{
  margin-top:6px;
  font-size:14px;
  background:#f5f5f5;
  padding:6px;
  border-left:4px solid #2E8B57;
}
</style>
</head>

<body>

<div id="content"></div>

<script src="exam-status.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const examId = params.get("exam");

if(!examId || !EXAM_STATUS[examId] || !EXAM_STATUS[examId].visible){
  document.body.innerHTML = "Invalid Exam!";
}

function loadQuestionsJS(path, callback){
  let script = document.createElement("script");
  script.src = path;
  script.onload = callback;
  document.body.appendChild(script);
}

loadQuestionsJS(`exam-corner/${examId}/questions.js`, ()=>{

  const container = document.getElementById("content");

  let fullText = `
${EXAM_STATUS[examId].title}
Answer with Detailed Solution
তারিখ: ${new Date().toLocaleDateString("bn-BD")}

`;

  QUESTIONS.forEach((q,index)=>{

    fullText += `
${index+1}. ${q.question}
`;

    q.options.forEach((opt,i)=>{
      fullText += `
${String.fromCharCode(65+i)}. ${opt}
`;
    });

    fullText += `
ব্যাখ্যা: ${q.explanation}

`;
  });

  container.innerText = fullText;

});
</script>

</body>
</html>

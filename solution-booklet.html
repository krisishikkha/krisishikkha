<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Solution Booklet</title>
<style>
body{
  font-family: Arial, sans-serif;
  margin:40px;
  line-height:1.7;
}
h1{text-align:center;}
.cover{text-align:center;margin-top:150px;page-break-after: always;}
.question-block{margin-bottom:30px;page-break-inside: avoid;}
.question{font-weight:600;margin-bottom:8px;}
.option{margin-left:20px;}
.correct{color:green;font-weight:600;}
.explanation{margin-top:8px;font-size:14px;background:#f5f5f5;padding:8px;border-left:4px solid #2E8B57;}
</style>
</head>
<body>

<div id="content"></div>

<script src="exam-status.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const examId = params.get("exam");

if(!examId || !EXAM_STATUS[examId] || !EXAM_STATUS[examId].visible){
  alert("Exam hidden or invalid!");
}

// Load questions dynamically
function loadQuestionsJS(path, callback){
  let script = document.createElement("script");
  script.src = path;
  script.onload = callback;
  document.body.appendChild(script);
}

loadQuestionsJS(`exam-corner/${examId}/questions.js`, ()=>{

  const container = document.getElementById("content");

  // Cover page
  container.innerHTML += `
    <div class="cover">
      <h1>${EXAM_STATUS[examId].title}</h1>
      <p>Answer with Detailed Solution</p>
      <p>তারিখ: ${new Date().toLocaleDateString("bn-BD")}</p>
    </div>
  `;

  // Questions
  QUESTIONS.forEach((q,index)=>{
    let block = document.createElement("div");
    block.className = "question-block";

    let html = `<div class="question">${index+1}. ${q.question}</div>`;

    q.options.forEach((opt,i)=>{
      html += `<div class="option ${i===q.answer ? "correct":""}">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });

    html += `<div class="explanation"><strong>ব্যাখ্যা:</strong> ${q.explanation}</div>`;

    block.innerHTML = html;
    container.appendChild(block);
  });

  // ✅ Save as PDF automatically
  setTimeout(()=>{
    const printWindow = window.open('', '_blank');
    printWindow.document.write('<html><head><title>PDF</title>');
    printWindow.document.write('<style>body{font-family:Arial,sans-serif;margin:40px;line-height:1.7;} .question-block{margin-bottom:30px;} .question{font-weight:600;} .option{margin-left:20px;} .correct{color:green;font-weight:600;} .explanation{margin-top:8px;font-size:14px;background:#f5f5f5;padding:8px;border-left:4px solid #2E8B57;}</style>');
    printWindow.document.write('</head><body>');
    printWindow.document.write(container.innerHTML);
    printWindow.document.write('</body></html>');
    printWindow.document.close();
    printWindow.focus();
    printWindow.print();
    printWindow.close();
  },500);

});
</script>

</body>
</html>

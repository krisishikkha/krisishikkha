<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam | Krisishikkha</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L6K7Q8203"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-L6K7Q8203');
  </script>

  <!-- Exam Status + shared scheduling helper (order matters: schedule needs EXAM_STATUS) -->
  <script src="exam-status.js"></script>
  <script src="exam-schedule.js"></script>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="loginSection">
    <h2>NTCA Agriculture Online Model Test</h2>
    <div id="warning" style="color:red;"></div>
    <input type="text" id="studentName" placeholder="আপনার নাম লিখুন"><br>
    <input type="password" id="accessCode" placeholder="কোড লিখুন"><br>
    <button onclick="validateAccess()">পরীক্ষায় অংশগ্রহণ করুন</button>
  </div>

  <!-- EXAM SECTION -->
  <div id="examMain" style="display:none; padding:20px;">
    <div id="examTitle"></div>
    <div class="timer-wrapper">
      <div class="timer-box">
        Time Left: <span id="timeLeft">25:00</span>
      </div>
    </div>
    <div id="examContainer"></div>
    <br>
    <button onclick="submitExam()">পরীক্ষা জমা দিন</button>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Exam JS -->
  <script src="exam.js"></script>

</body>
</html>

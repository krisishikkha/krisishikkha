<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Krisishikkha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon {
            font-size: 6em;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 15px;
        }
        p {
            color: #7f8c8d;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .retry-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1em;
            transition: transform 0.3s ease;
            cursor: pointer;
            border: none;
        }
        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="icon">📡</div>
        <h1>ইন্টারনেট সংযোগ নেই</h1>
        <p>দুঃখিত! আপনার ইন্টারনেট সংযোগ বিচ্ছিন্ন হয়েছে। অনুগ্রহ করে আপনার সংযোগ পরীক্ষা করে পুনরায় চেষ্টা করুন।</p>
        <button class="retry-btn" onclick="window.location.reload()">
            🔄 পুনরায় চেষ্টা করুন
        </button>
        <p style="margin-top: 30px; font-size: 0.9em;">
            ক্যাশ করা কন্টেন্ট দেখতে 
            <a href="/" style="color: #667eea; text-decoration: none; font-weight: bold;">হোম পেজে</a> যান
        </p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Scoreboard - Written Exam">
    <title>Admin Scoreboard - Written Exam</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="./css/written-exam.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <div class="container">
                <h1 class="admin-title">📊 Admin Scoreboard</h1>
                <p class="admin-subtitle">Written Exam Results Management</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="container">
                <!-- Filter Section -->
                <div class="admin-filters-card">
                    <h2 class="card-title">Filter Scoreboard</h2>
                    
                    <div class="filter-grid">
                        <!-- Exam Selection -->
                        <div class="form-group">
                            <label for="exam-select">Select Exam Set *</label>
                            <select id="exam-select" class="form-control">
                                <option value="">-- Select Exam --</option>
                            </select>
                        </div>

                        <!-- From Date -->
                        <div class="form-group">
                            <label for="from-date">From Date</label>
                            <input type="date" id="from-date" class="form-control">
                        </div>

                        <!-- To Date -->
                        <div class="form-group">
                            <label for="to-date">To Date</label>
                            <input type="date" id="to-date" class="form-control">
                        </div>
                    </div>

                    <div class="filter-actions">
                        <button onclick="generateScoreboard()" class="btn btn-primary btn-large">
                            🔍 Generate Scoreboard
                        </button>
                        <button onclick="clearFilters()" class="btn btn-secondary">
                            Clear Filters
                        </button>
                    </div>
                </div>

                <!-- Scoreboard Display -->
                <div id="scoreboard-section" style="display: none;">
                    <!-- Summary Stats -->
                    <div class="scoreboard-stats">
                        <div class="stat-card">
                            <div class="stat-icon">👥</div>
                            <div class="stat-content">
                                <div class="stat-value" id="total-participants">0</div>
                                <div class="stat-label">Total Participants</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📈</div>
                            <div class="stat-content">
                                <div class="stat-value" id="average-score">0%</div>
                                <div class="stat-label">Average Score</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">🏆</div>
                            <div class="stat-content">
                                <div class="stat-value" id="highest-score">0</div>
                                <div class="stat-label">Highest Marks</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">📉</div>
                            <div class="stat-content">
                                <div class="stat-value" id="lowest-score">0</div>
                                <div class="stat-label">Lowest Marks</div>
                            </div>
                        </div>
                    </div>

                    <!-- Download PDF Button -->
                    <div class="scoreboard-actions">
                        <button onclick="downloadPDF()" class="btn btn-success btn-large">
                            📥 Download Scoreboard PDF
                        </button>
                    </div>

                    <!-- Scoreboard Table -->
                    <div class="scoreboard-table-container">
                        <table class="scoreboard-table" id="scoreboard-table">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Student Name</th>
                                    <th>Correct</th>
                                    <th>Wrong</th>
                                    <th>Skipped</th>
                                    <th>Marks</th>
                                    <th>Percentage</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="scoreboard-body">
                                <!-- Rows will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- No Results Message -->
                <div id="no-results" class="no-results" style="display: none;">
                    <div class="no-results-icon">📭</div>
                    <h3>No Results Found</h3>
                    <p>No submissions found for the selected filters.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Config -->
    <script src="./js/config.js"></script>

    <script>
        let supabase;
        let scoreboardData = [];
        let selectedExam = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize Supabase
            supabase = window.supabase.createClient(
                SUPABASE_CONFIG.url,
                SUPABASE_CONFIG.anonKey
            );

            // Load exam list
            await loadExamList();

            // Set default dates (last 30 days)
            setDefaultDates();
        });

        async function loadExamList() {
            try {
                const response = await fetch(DATA_PATH + EXAMS_JSON);
                const data = await response.json();

                const select = document.getElementById('exam-select');
                data.exams.forEach(exam => {
                    const option = document.createElement('option');
                    option.value = exam.id;
                    option.textContent = exam.title;
                    select.appendChild(option);
                });

            } catch (error) {
                console.error('Error loading exams:', error);
                alert('Failed to load exam list');
            }
        }

        function setDefaultDates() {
            const today = new Date();
            const thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(today.getDate() - 30);

            document.getElementById('to-date').valueAsDate = today;
            document.getElementById('from-date').valueAsDate = thirtyDaysAgo;
        }

        async function generateScoreboard() {
            const examId = document.getElementById('exam-select').value;
            const fromDate = document.getElementById('from-date').value;
            const toDate = document.getElementById('to-date').value;

            if (!examId) {
                alert('Please select an exam');
                return;
            }

            try {
                // Build query
                let query = supabase
                    .from(WRITTEN_EXAM_TABLE)
                    .select('*')
                    .eq('exam_id', examId)
                    .order('obtained_marks', { ascending: false });

                // Add date filters if provided
                if (fromDate) {
                    query = query.gte('submitted_at', fromDate + 'T00:00:00');
                }
                if (toDate) {
                    query = query.lte('submitted_at', toDate + 'T23:59:59');
                }

                const { data, error } = await query;

                if (error) throw error;

                if (!data || data.length === 0) {
                    showNoResults();
                    return;
                }

                scoreboardData = data;
                selectedExam = data[0].exam_name;

                displayScoreboard(data);

            } catch (error) {
                console.error('Error generating scoreboard:', error);
                alert('Failed to generate scoreboard');
            }
        }

        function displayScoreboard(data) {
            // Calculate statistics
            const totalParticipants = data.length;
            const averageScore = (data.reduce((sum, item) => sum + item.percentage, 0) / totalParticipants).toFixed(2);
            const highestScore = Math.max(...data.map(item => item.obtained_marks));
            const lowestScore = Math.min(...data.map(item => item.obtained_marks));

            // Display stats
            document.getElementById('total-participants').textContent = totalParticipants;
            document.getElementById('average-score').textContent = averageScore + '%';
            document.getElementById('highest-score').textContent = highestScore;
            document.getElementById('lowest-score').textContent = lowestScore;

            // Display table
            const tbody = document.getElementById('scoreboard-body');
            tbody.innerHTML = '';

            data.forEach((item, index) => {
                const row = document.createElement('tr');
                
                // Rank styling
                let rankClass = '';
                if (index === 0) rankClass = 'rank-1';
                else if (index === 1) rankClass = 'rank-2';
                else if (index === 2) rankClass = 'rank-3';

                row.innerHTML = `
                    <td class="rank-cell ${rankClass}">${index + 1}</td>
                    <td class="name-cell">${item.student_name}</td>
                    <td class="correct-cell">${item.correct}</td>
                    <td class="wrong-cell">${item.wrong}</td>
                    <td class="skipped-cell">${item.skipped}</td>
                    <td class="marks-cell"><strong>${item.obtained_marks}</strong>/${item.total_marks}</td>
                    <td class="percentage-cell">${item.percentage}%</td>
                    <td class="date-cell">${new Date(item.submitted_at).toLocaleDateString('en-GB')}</td>
                `;

                tbody.appendChild(row);
            });

            // Show scoreboard section
            document.getElementById('scoreboard-section').style.display = 'block';
            document.getElementById('no-results').style.display = 'none';
        }

        function showNoResults() {
            document.getElementById('scoreboard-section').style.display = 'none';
            document.getElementById('no-results').style.display = 'flex';
        }

        function clearFilters() {
            document.getElementById('exam-select').value = '';
            setDefaultDates();
            document.getElementById('scoreboard-section').style.display = 'none';
            document.getElementById('no-results').style.display = 'none';
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');

            // Title
            doc.setFontSize(18);
            doc.text(PDF_CONFIG.organizationNameEnglish, 14, 20);
            
            doc.setFontSize(14);
            doc.text('Written Exam Scoreboard', 14, 28);
            
            doc.setFontSize(11);
            doc.text(`Exam: ${selectedExam}`, 14, 35);
            
            const fromDate = document.getElementById('from-date').value;
            const toDate = document.getElementById('to-date').value;
            doc.text(`Date Range: ${fromDate || 'All'} to ${toDate || 'All'}`, 14, 41);
            doc.text(`Generated: ${new Date().toLocaleString('en-GB')}`, 14, 47);

            // Table data
            const tableData = scoreboardData.map((item, index) => [
                index + 1,
                item.student_name,
                item.correct,
                item.wrong,
                item.skipped,
                `${item.obtained_marks}/${item.total_marks}`,
                item.percentage + '%',
                new Date(item.submitted_at).toLocaleDateString('en-GB')
            ]);

            // Generate table
            doc.autoTable({
                head: [['Rank', 'Name', 'Correct', 'Wrong', 'Skipped', 'Marks', 'Percentage', 'Date']],
                body: tableData,
                startY: 53,
                theme: 'grid',
                headStyles: { fillColor: [37, 99, 235] },
                styles: { fontSize: 9 },
                columnStyles: {
                    0: { cellWidth: 15 },
                    1: { cellWidth: 50 }
                }
            });

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.text(
                    PDF_CONFIG.footerText,
                    doc.internal.pageSize.width / 2,
                    doc.internal.pageSize.height - 10,
                    { align: 'center' }
                );
            }

            // Save PDF
            const fileName = `Scoreboard_${selectedExam.replace(/\s+/g, '_')}_${new Date().getTime()}.pdf`;
            doc.save(fileName);
        }
    </script>
</body>
</html>

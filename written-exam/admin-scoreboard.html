<!-- written-exam/admin-scoreboard.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/written-exam.css">
</head>
<body>

    <!-- ========== LOGIN SCREEN ========== -->
    <div id="loginScreen" class="we-entry-wrap">
        <h1 class="we-entry-title">Admin Login</h1>
        <div class="we-form-group">
            <label for="adminEmail">Email</label>
            <input type="email" id="adminEmail" placeholder="admin@example.com">
        </div>
        <div class="we-form-group">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" placeholder="Password">
        </div>
        <p id="loginError" class="we-error" style="display:none;"></p>
        <button id="loginBtn" class="we-btn we-btn-primary">Login</button>
    </div>

    <!-- ========== DASHBOARD ========== -->
    <div id="dashboard" class="we-container" style="display:none;">
        <div class="we-admin-top">
            <h1>Written Exam Scoreboard</h1>
            <button id="logoutBtn" class="we-btn we-btn-secondary">Logout</button>
        </div>

        <div class="we-filter-box">
            <div class="we-form-group">
                <label for="examSelect">Exam Set</label>
                <select id="examSelect"></select>
            </div>
            <div class="we-form-group">
                <label for="fromDate">From Date</label>
                <input type="date" id="fromDate">
            </div>
            <div class="we-form-group">
                <label for="toDate">To Date</label>
                <input type="date" id="toDate">
            </div>
            <button id="generateBtn" class="we-btn we-btn-primary">Generate Scoreboard</button>
        </div>

        <div id="scoreboardResult"></div>

        <button id="downloadPdfBtn" class="we-btn we-btn-primary" style="display:none;">
            Download Scoreboard PDF
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/config.js"></script>
    <script src="data/bina-so-exam-1.js"></script>
    <!-- নতুন exam যোগ হলে এখানে আরেকটা <script> লাইন -->
    <script src="data/exams.js"></script>
    <script src="js/pdf-helper.js"></script>
    <script src="js/admin-scoreboard.js"></script>
</body>
</html>

<!-- written-exam/index.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Written Exam</title>
<link rel="stylesheet" href="css/written-exam.css">
</head>
<body>

    <script>
    window.addEventListener('error', function(e) {
        var msg = document.createElement('div');
        msg.style.cssText = 'background:#fee;color:#900;padding:12px;font-size:13px;text-align:left;border:2px solid #f99;margin:10px;white-space:pre-wrap;';
        msg.textContent = '⚠️ JS ERROR:\n' + e.message + '\nFile: ' + e.filename + '\nLine: ' + e.lineno;
        document.body.insertBefore(msg, document.body.firstChild);
    });
    </script>

    <header class="we-header">
        <a href="../index.html" class="we-back">← Home</a>
        <h1>Written Exam</h1>
    </header>

    <main class="we-container">
        <div id="examListContainer" class="we-exam-grid">
            <p class="we-loading">Loading exams...</p>
        </div>
    </main>

    <!-- ========== LOCKED EXAM POPUP ========== -->
    <div id="lockedModal" class="we-modal" style="display:none;">
        <div class="we-modal-box">
            <p id="lockedModalText">আপনি যদি এই এক্সাম ব্যাচে ভর্তি হতে চান, তাহলে WhatsApp-এ যোগাযোগ করুন।</p>
            <a id="lockedWhatsappBtn" href="#" target="_blank" rel="noopener noreferrer" class="we-btn we-btn-primary we-block-btn">
                📱 WhatsApp-এ যোগাযোগ করুন
            </a>
            <button id="closeLockedModalBtn" class="we-btn we-btn-secondary we-block-btn" style="margin-top:10px;">Close</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="data/exams.js"></script>
    <script src="js/exam-loader.js"></script>
    <script src="js/exam-list.js"></script>
</body>
</html>

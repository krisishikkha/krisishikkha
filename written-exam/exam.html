<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam - Written Exam System</title>
    <link rel="stylesheet" href="css/written-exam.css">
</head>
<body class="exam-page">
    <!-- Student Entry Modal -->
    <div id="studentEntryModal" class="modal">
        <div class="modal-content">
            <h2>Student Information</h2>
            <form id="studentEntryForm">
                <div class="form-group">
                    <label for="studentName">Your Name / আপনার নাম:</label>
                    <input type="text" id="studentName" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="accessCode">Access Code / এক্সেস কোড:</label>
                    <input type="text" id="accessCode" required placeholder="Enter exam access code">
                </div>
                <button type="submit" class="btn btn-primary">Start Exam / পরীক্ষা শুরু করুন</button>
            </form>
        </div>
    </div>

    <!-- Exam Interface -->
    <div id="examInterface" style="display: none;">
        <!-- Header -->
        <header class="exam-header">
            <div class="exam-info">
                <h3 id="examTitle">Exam Title</h3>
                <span id="studentNameDisplay"></span>
            </div>
            <div class="timer-container">
                <div id="timer" class="timer">60:00</div>
                <div class="auto-save-indicator" id="autoSaveStatus">Auto-saved</div>
            </div>
        </header>

        <!-- Question Display -->
        <div class="exam-body">
            <div class="question-container">
                <div class="question-header">
                    <span class="question-number" id="questionNumber">Question 1 of 40</span>
                    <span class="question-marks" id="questionMarks">Marks: 1</span>
                </div>
                
                <div class="question-text" id="questionText">
                    <!-- Question will be loaded here -->
                </div>

                <div class="answer-input-container">
                    <div class="answer-input-wrapper">
                        <input 
                            type="text" 
                            id="answerInput" 
                            class="answer-input" 
                            placeholder="Type your answer here / এখানে উত্তর লিখুন"
                            disabled
                        >
                        <button class="btn-icon btn-edit" id="editBtn" title="Edit Answer">
                            ✏️
                        </button>
                        <button class="btn-icon btn-tick" id="tickBtn" style="display: none;" title="Save Answer">
                            ✅
                        </button>
                    </div>
                </div>

                <div class="answer-status" id="answerStatus">
                    <!-- Status will be shown here -->
                </div>
            </div>

            <!-- Question Navigator -->
            <div class="question-navigator">
                <h4>Question Navigator</h4>
                <div id="questionGrid" class="question-grid">
                    <!-- Question numbers will be loaded here -->
                </div>
                <div class="navigator-legend">
                    <div><span class="legend-box answered"></span> Answered</div>
                    <div><span class="legend-box current"></span> Current</div>
                    <div><span class="legend-box unanswered"></span> Not Answered</div>
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="exam-footer">
            <button class="btn btn-secondary" id="prevBtn">⬅️ Previous</button>
            <button class="btn btn-primary" id="nextBtn">Next ➡️</button>
            <button class="btn btn-success" id="submitBtn">Submit Exam</button>
        </div>
    </div>

    <!-- Submit Confirmation Modal -->
    <div id="submitModal" class="modal">
        <div class="modal-content">
            <h2>⚠️ Submit Exam?</h2>
            <div id="submitSummary"></div>
            <p>Are you sure you want to submit? You cannot change answers after submission.</p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelSubmit">Cancel</button>
                <button class="btn btn-success" id="confirmSubmit">Yes, Submit</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/answer-checker.js"></script>
    <script src="js/exam.js"></script>
</body>
</html>

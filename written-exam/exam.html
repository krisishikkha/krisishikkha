<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam</title>
    <link rel="stylesheet" href="css/written-exam.css">
</head>
<body class="exam-page">
    
    <div id="studentEntryModal" class="modal active">
        <div class="modal-content">
            <h2>📝 Student Information</h2>
            <form id="studentEntryForm">
                <div class="form-group">
                    <label>Your Name / আপনার নাম:</label>
                    <input type="text" id="studentName" required>
                </div>
                <div class="form-group">
                    <label>Access Code / এক্সেস কোড:</label>
                    <input type="text" id="accessCode" required>
                </div>
                <button type="submit" class="btn btn-primary">Start Exam</button>
                <a href="index.html" class="btn btn-secondary" style="display:block;margin-top:10px;text-align:center;">Back</a>
            </form>
        </div>
    </div>

    <div id="examInterface" style="display:none;">
        <header class="exam-header">
            <div class="exam-info">
                <h3 id="examTitle"></h3>
                <span id="studentNameDisplay"></span>
            </div>
            <div class="timer-container">
                <div id="timer" class="timer">60:00</div>
                <div id="autoSaveStatus"></div>
            </div>
        </header>

        <div class="exam-body">
            <div class="question-container">
                <div class="question-header">
                    <span id="questionNumber"></span>
                    <span id="questionMarks"></span>
                </div>
                <div id="questionText"></div>
                <div class="answer-input-container">
                    <div class="answer-input-wrapper">
                        <input type="text" id="answerInput" class="answer-input" disabled>
                        <button id="editBtn" class="btn-icon btn-edit">✏️</button>
                        <button id="tickBtn" class="btn-icon btn-tick" style="display:none;">✅</button>
                    </div>
                </div>
                <div id="answerStatus"></div>
            </div>

            <div class="question-navigator">
                <h4>Navigator</h4>
                <div id="questionGrid" class="question-grid"></div>
                <div class="navigator-legend">
                    <div><span class="legend-box answered"></span> Answered</div>
                    <div><span class="legend-box current"></span> Current</div>
                    <div><span class="legend-box unanswered"></span> Not Answered</div>
                </div>
            </div>
        </div>

        <div class="exam-footer">
            <button id="prevBtn" class="btn btn-secondary">⬅️ Previous</button>
            <button id="nextBtn" class="btn btn-primary">Next ➡️</button>
            <button id="submitBtn" class="btn btn-success">Submit</button>
        </div>
    </div>

    <div id="submitModal" class="modal">
        <div class="modal-content">
            <h2>Submit Exam?</h2>
            <div id="submitSummary"></div>
            <p style="text-align:center;color:#EF4444;">আপনি কি নিশ্চিত?</p>
            <div class="modal-actions">
                <button id="cancelSubmit" class="btn btn-secondary">Cancel</button>
                <button id="confirmSubmit" class="btn btn-success">Submit</button>
            </div>
        </div>
    </div>

    <!-- Load dependencies first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="data/exams.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/answer-checker.js"></script>
    
    <!-- Dynamic loader script -->
    <script>
        console.log('=== EXAM PAGE INIT ===');
        
        const examId = sessionStorage.getItem('selectedExamId');
        console.log('Selected Exam ID:', examId);
        
        if (!examId) {
            alert('No exam selected!');
            window.location.href = 'index.html';
            throw new Error('No exam selected');
        }
        
        const examMeta = EXAM_REGISTRY.exams.find(e => e.id === examId);
        console.log('Exam Meta:', examMeta);
        
        if (!examMeta) {
            alert('Exam not found!');
            window.location.href = 'index.html';
            throw new Error('Exam not found');
        }
        
        if (examMeta.status !== 'active') {
            alert('This exam is not active!');
            window.location.href = 'index.html';
            throw new Error('Exam not active');
        }
        
        // Load question file
        const questionScript = document.createElement('script');
        questionScript.src = `data/${examId}.js`;
        
        questionScript.onload = function() {
            console.log('✅ Question file loaded');
            
            // Verify question data exists
            const varName = 'EXAM_DATA_' + examId.toUpperCase().replace(/-/g, '_');
            if (typeof window[varName] === 'undefined') {
                alert('Question data not found! Variable: ' + varName);
                window.location.href = 'index.html';
                return;
            }
            
            console.log('✅ Question data verified:', varName);
            
            // Now load exam.js
            const examScript = document.createElement('script');
            examScript.src = 'js/exam.js';
            
            examScript.onload = function() {
                console.log('✅ exam.js loaded');
                // exam.js will auto-initialize
            };
            
            examScript.onerror = function() {
                alert('Error loading exam.js');
            };
            
            document.body.appendChild(examScript);
        };
        
        questionScript.onerror = function() {
            alert('Question file not found: data/' + examId + '.js');
            window.location.href = 'index.html';
        };
        
        document.body.appendChild(questionScript);
    </script>
</body>
</html>

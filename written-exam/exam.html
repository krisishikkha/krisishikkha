<!-- written-exam/exam.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam</title>
<link rel="stylesheet" href="css/written-exam.css">
</head>
<body>

    <!-- ========== ENTRY SCREEN ========== -->
    <div id="entryScreen" class="we-entry-wrap">
        <h1 id="entryExamTitle" class="we-entry-title">Loading...</h1>
        <p id="entryExamMeta" class="we-entry-meta"></p>

        <div class="we-form-group">
            <label for="studentName">Name</label>
            <input type="text" id="studentName" placeholder="Enter Your Name">
        </div>

        <div class="we-form-group">
            <label for="accessCode">Access Code</label>
            <input type="text" id="accessCode" placeholder="Enter Access Code">
        </div>

        <p id="entryError" class="we-error" style="display:none;"></p>

        <button id="enterExamBtn" class="we-btn we-btn-primary">Enter Exam</button>
    </div>

    <!-- ========== EXAM SCREEN (ধাপ ৬-এ পূরণ হবে) ========== -->
    <div id="examScreen" class="we-exam-screen" style="display:none;">
        <div class="we-exam-top">
            <div id="timerDisplay" class="we-timer">Time Remaining: --:--</div>
            <div id="navigator" class="we-navigator"></div>
        </div>

        <div id="questionsContainer" class="we-questions-container"></div>

        <button id="submitExamBtn" class="we-btn we-btn-submit">Submit Exam</button>
    </div>

    <!-- ========== SUBMIT CONFIRMATION MODAL ========== -->
    <div id="confirmModal" class="we-modal" style="display:none;">
        <div class="we-modal-box">
            <p id="confirmText"></p>
            <div class="we-modal-actions">
                <button id="cancelSubmitBtn" class="we-btn we-btn-secondary">Cancel</button>
                <button id="confirmSubmitBtn" class="we-btn we-btn-primary">Submit Exam</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="data/bina-so-exam-1.js"></script>
    <!-- নতুন exam যোগ হলে এখানে আরেকটা <script> লাইন -->
    <script src="data/exams.js"></script>
    <script src="js/answer-checker.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/exam.js"></script>
</body>
</html>

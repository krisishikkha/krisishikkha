<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | BCS</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <div class="bcs-container">
    <div class="bcs-header">
      <p class="breadcrumb">
        <a href="index.html">BCS</a> / <span>Login</span>
      </p>
      <h1>BCS Login</h1>
      <p class="subtitle">
        Enter your user ID and password to access premium BCS resources.
      </p>
    </div>

    <div class="page-box login-box">
      <form id="loginForm" class="login-form">
        <label for="username" class="form-label">User ID</label>
        <input type="text" id="username" class="form-input" placeholder="Enter your user ID" />

        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" />

        <button type="submit" class="login-submit-btn">Login</button>
      </form>

      <div id="loginMessage" class="message-box"></div>

      <div class="login-status-wrap">
        <p id="loginStatus" class="login-status-text">Not logged in</p>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </div>
    </div>

    <div class="info-box">
      <h3>Access Note</h3>
      <p>
        After login, your premium BCS notes, premium articles, and premium question bank resources will become available until your access expires.
      </p>
    </div>

    <div class="back-wrap">
      <a href="index.html" class="back-btn">← Back to BCS</a>
    </div>
  </div>

  <script src="data/users.js"></script>
  <script src="auth.js"></script>
</body>
</html>

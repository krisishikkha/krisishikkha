<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    
    <!-- Dynamic Meta Tags (will be updated by JS) -->
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:type" content="article">
    <meta property="og:url" content="">
    
    <title>Loading...</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Header Component -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-container">
            <div class="sidebar-loading">Loading...</div>
        </aside>

        <!-- Article Content -->
        <main class="article-content">
            <!-- Breadcrumb -->
            <nav class="breadcrumb" id="articleBreadcrumb">
                <a href="/">হোম</a>
                <span class="separator">›</span>
                <a href="index.html">Important Job Topic</a>
                <span class="separator">›</span>
                <span class="current">Loading...</span>
            </nav>

            <!-- Article Header -->
            <article class="article-wrapper">
                <div id="articleHeader" class="article-header">
                    <div class="loading-spinner">Loading article...</div>
                </div>

                <!-- Article Featured Image -->
                <div id="articleImage" class="article-image"></div>
              
                <!-- Article Body -->
                <div id="articleBody" class="article-body"></div>

                <!-- Article Tags -->
                <div id="articleTags" class="article-tags"></div>

                <!-- Social Share -->
                <div class="social-share">
                    <h3>শেয়ার করুন:</h3>
                    <div class="share-buttons">
                        <button onclick="shareOnFacebook()" class="share-btn facebook">
                            Facebook
                        </button>
                        <button onclick="shareOnWhatsApp()" class="share-btn whatsapp">
                            WhatsApp
                        </button>
                        <button onclick="copyLink()" class="share-btn copy">
                            Copy Link
                        </button>
                    </div>
                </div>
            </article>

            <!-- Related Articles -->
            <section class="related-articles">
                <h2>📖 সম্পর্কিত আর্টিকেল</h2>
                <div id="relatedArticles" class="article-grid"></div>
            </section>
        </main>
    </div>

    <!-- Footer Component -->
    <div id="footer-container"></div>

    <!-- JavaScript Files -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/article-loader.js"></script>
    <script src="js/seo.js"></script>

    <!-- Initialize Article Page -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadComponents();
            loadArticleFromURL();
        });

        function shareOnFacebook() {
            const url = encodeURIComponent(window.location.href);
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
        }

        function shareOnWhatsApp() {
            const url = encodeURIComponent(window.location.href);
            const text = encodeURIComponent(document.title);
            window.open(`https://wa.me/?text=${text} ${url}`, '_blank');
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('লিংক কপি হয়েছে!');
            });
        }
    </script>
</body>
</html>
